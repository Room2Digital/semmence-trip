bag","binbags"]},{"bag":"GONE","mode":"left","items":[{"n":"MacBook Pro and iPad mini","note":"Handed over in Phuket on the way out."}],"note":"","ids":["mbp","ipad-mini"]},{"bag":"worn","mode":"worn","items":[{"n":"Apple Watch"},{"n":"Nice trainers"}],"note":"","ids":["watch","trainers-nice"]}]}],"bags":[{"id":"L1","name":"Suitcase 1","img":"img/bag-L1.jpg","airtag":1,"empty":4200},{"id":"L2","name":"Suitcase 2","img":"img/bag-L2.jpg","airtag":1,"empty":4200},{"id":"CB","name":"Cabin bag","img":"img/bag-CB.jpg","airtag":1,"empty":2800},{"id":"BP","name":"Backpack","img":"img/bag-BP.jpg","airtag":1,"empty":1200},{"id":"SL","name":"Sling","img":"img/bag-SL.jpg","airtag":1,"empty":300},{"id":"GONE","name":"Handed over","empty":0},{"id":"WORN","name":"Worn","empty":0}],"daybags":[{"id":"rottnest","name":"Rottnest Island","date":"2027-01-02","dates":"Sat 2 Jan","bag":"Lockable daypack","where":"Fremantle \u2192 Thomson Bay","note":"Ferry out 09:00 from O'Connor Landing, e-bikes 09:30\u201315:30 from Pedal & Flipper, ferry back 16:00. Booking 2G6JZV, 3 adults, same-day return \u2014 the fare includes the island admission. Be at the terminal by 08:30; boarding closes 08:50.","warn":"Six hours on a bike in peak Australian summer with almost no shade, and you're drinking. This is the single most sunburn-and-dehydration-prone day of the whole trip. The bikes are due back at 15:30 and the last ferry is 16:00 \u2014 that is 30 minutes of margin, so do the drinking at Hotel Rottnest at the end, near the jetty, not at a far bay.","items":[{"name":"Larq bottle, filled","ref":"larq","g":500,"crit":true,"note":"Filling stations at Thomson Bay, Geordie Bay and The Basin, with long stretches between them. Freeze it the night before."},{"name":"Water, a second 1.5 litres","ref":null,"g":1500,"crit":true,"note":"One litre is not six hours on a bike in an Australian summer."},{"name":"Body suncream","ref":"suncream","g":200,"crit":true,"note":"Before you leave the ferry, then again at every beach stop."},{"name":"Face suncream","ref":"suncream-face","g":50,"crit":true},{"name":"Microfibre towel, large","ref":"towel-lg","g":340,"crit":true},{"name":"Mini shower gel","ref":"showergel","g":60,"note":"For the rinse before drinks at Hotel Rottnest."},{"name":"Mini face wash","ref":"facewash","g":90},{"name":"Moisturiser","ref":"moisturiser","g":100},{"name":"Roll-on deodorant","ref":"deodorant","g":100},{"name":"Hat","ref":"hats","g":100,"crit":true,"note":"Has to stay on at bike speed. A strap, or wear it backwards."},{"name":"Sunglasses","ref":"sunglasses-daily","g":120,"crit":true},{"name":"Swim shorts \u2014 worn under","ref":"swim","g":100,"crit":true,"note":"Changing facilities are thin away from the settlement."},{"name":"Dry bag","ref":"drybag","g":120,"crit":true,"note":"Phone, wallet and keys while you swim. Bags are not watched at the bays."},{"name":"Power bank","ref":"brick-sm","g":200,"note":"Maps, photos and the return ferry QR all live on your phone."},{"name":"Card and some cash","ref":"cards","g":20,"note":"Take a bit of the AUD 200 float \u2014 this is the sort of day it exists for."},{"name":"T-shirt, dry","ref":"tees","g":150,"crit":true,"note":"You will be salty, sunburnt and damp at 16:00 and the ferry air con is cold."},{"name":"Shorts, dry","ref":"shorts","g":200,"crit":true},{"name":"2 boxers","ref":"boxers","g":70,"crit":true},{"name":"1 socks","ref":"socks-white","g":40},{"name":"Sliders","ref":"sliders","g":280,"note":"For after the bikes go back. Six hours in cycling shoes is enough."},{"name":"Snacks","ref":null,"g":200,"note":"Food away from Thomson Bay is essentially nothing."},{"name":"Plasters","ref":"plasters","g":30,"note":"Saddle soreness and a blister from wet feet in dry shoes are the likely two."},{"name":"Ferry booking 2G6JZV","ref":null,"g":0,"crit":true,"note":"Saved offline. Show the barcode to the crew at the vessel."}]},{"id":"cricket","name":"BBL at Optus Stadium","date":"2026-12-26","dates":"Sat 26 Dec","bag":"Sling bag only","where":"Perth Scorchers v Melbourne Stars","note":"18:15 to 22:15, Boxing Day. Four tickets at A$74 each, bought through Ticketmaster \u2014 they live in the Ticketmaster app, so have it installed and logged in before you go.","warn":"Bag rules are enforced: nothing larger than 40 x 30 cm, and some events ban backpacks entirely. Take the sling, not the daypack. A sealed or empty water bottle is fine, glass and cans are not.","items":[{"name":"Tickets in the Ticketmaster app","ref":null,"g":0,"crit":true,"note":"Downloaded before you leave \u2014 stadium wifi at a full house is not something to rely on."},{"name":"Phone","ref":"phone","g":220,"crit":true},{"name":"Mini charger brick","ref":"brick-sm","g":200,"note":"18:15 to 22:15 with the tickets on your phone."},{"name":"Decanted suncream","ref":"suncream-tr","g":80,"crit":true,"note":"A 18:15 start in December still has hours of sun on you."},{"name":"Sunglasses","ref":"sunglasses-daily","g":120},{"name":"Card","ref":"cards","g":20,"note":"The stadium is cashless."}]}],"shopping":[{"id":"perth","name":"Perth, first few days","when":"From 20 Nov","where":"Coles or Woolworths \u00b7 Chemist Warehouse \u00b7 BWS or Liquorland \u00b7 any sports shop","note":"You have seven weeks here and a kitchen at the Sebel, so this is a proper shop, not a top-up. Chemist Warehouse is substantially cheaper than a supermarket for toiletries and supplements \u2014 it's the one worth a dedicated trip.","items":[{"name":"Protein powder","crit":true,"note":"Chemist Warehouse or a sports shop beats the supermarket on price. Buy a tub sized for seven weeks \u2014 you won't be taking it to Thailand, so don't over-buy. A shaker bottle is all you need for this; no blender required."},{"name":"Aftersun or aloe","note":"Perth in December catches everyone once. Cheaper here than regretting it."},{"name":"Washing machine pods","note":"The Sebel is self-service, so you need your own for the first stretch. Thailand is paid-for and you won't need these there \u2014 don't buy a big box."},{"name":"Dryer sheets","note":"Only worth it if the machine is a washer-dryer or there's a dryer in the building. Worth checking on arrival before you buy."},{"name":"Milk","note":"First shop. The Sebel has a kitchen."},{"name":"Eggs","note":""},{"name":"Breakfast and kitchen basics","note":"Coffee, cereal, bread \u2014 whatever stops you buying breakfast out every day for four weeks."},{"name":"Spreadable butter","note":""},{"name":"Vegemite","note":"Yeast extract, same family as Marmite but saltier, darker and less sweet. Spread it far thinner than you would Marmite."},{"name":"Kitchen roll","note":""},{"name":"Six pack of beer","note":"Not in Coles or Woolworths \u2014 WA supermarkets don't sell alcohol. Liquorland, BWS or Dan Murphy's, usually attached to the same centre."}]},{"id":"thailand","name":"Thailand top-up","when":"From 7 Jan","where":"7-Eleven, Boots or any pharmacy","note":"Deliberately short. Everything here is cheap, everywhere, and carrying it from Australia is pointless \u2014 especially with the cases going into storage on the 10th.","items":[{"name":"DEET insect repellent","crit":true,"note":"Stronger and cheaper than anything you'd bring. Khao Sok is jungle on water and the lake is worst at dusk."},{"name":"Suncream top-up","note":"You'll have burned through the decanted 100 ml by Samui."},{"name":"Elephant pants","crit":true,"note":"Your temple trousers. Buy them in Bangkok on the 11th, before the Grand Palace and Wat Phra Kaew \u2014 the dress code is enforced at the gate, not politely overlooked."},{"name":"Small dry bag, if you haven't bought one at home","note":"Beach shops in Samui and Krabi sell them everywhere. Needed before Khao Sok on the 17th."},{"name":"Cheap flip-flops","note":"The pair you leave behind. Beach, boat and bathroom."}]}]};</script>
<script>/* ───────────────────────────── PACKING ─────────────────────────────
   The packing app, folded into the trip app as a tab.

   Everything lives inside this closure. The trip app and the packing
   code both want names like store, esc, render, TAB and totals, so
   nothing here is global except window.PK — the handful of entry
   points the inline handlers in the generated HTML call.

   State: ticks and bag moves sync through Supabase pack_state, custom
   items through pack_items, exactly as the standalone app did, so the
   two stayed interchangeable right up to the point the standalone one
   was retired. */
const PK = (function () {
  const D = PACKDATA,
    BAGS = D.bags,
    LEGS = D.legs,
    DAYBAGS = D.daybags || [],
    SHOPPING = D.shopping || [];

  let ITEMS = D.items.slice().concat(store.get("pack:custom", [])),
    ST = store.get("pack:state", {}),
    LEG = store.get("pack:leg", null),
    VIEW = "leg",
    OPENBAG = null,
    OPENDAY = null,
    OPENSHOP = null,
    Q = "",
    ADDBAG = "",
    OFFLINE = !1;

  const KEEPSCROLL = () => {
    KEEPY = window.scrollY;
  };
  const COL = {
      L1: "var(--blue)",
      L2: "var(--green)",
      CB: "var(--violet)",
      BP: "var(--orange)",
      SL: "var(--pink)",
      WORN: "var(--violet)",
      worn: "var(--violet)",
    },
    ICON = { L1: "🧳", L2: "👟", CB: "🎒", BP: "🪢", SL: "📱", WORN: "👕", worn: "👕" },
    CATICON = {
      docs: "📄",
      tech: "🔌",
      toiletries: "🧴",
      health: "💊",
      clothing: "👕",
      footwear: "👟",
      kit: "🧰",
      flight: "✈️",
      added: "✏️",
    },
    MODE = {
      cabin: { label: "Cabin", cls: "cabin" },
      checked: { label: "Checked", cls: "checked" },
      with: { label: "With you", cls: "with" },
      worn: { label: "Worn", cls: "worn" },
      left: { label: "Not with you", cls: "left" },
    };

  const bagOf = (i) => (ST[i.id] && ST[i.id].bag) || i.bag,
    packed = (i) => !!(ST[i.id] && ST[i.id].packed),
    on = (k) => !!(ST[k] && ST[k].packed),
    kg = (g) => (g >= 1000 ? (g / 1000).toFixed(1) + " kg" : Math.round(g) + " g"),
    bagMeta = (id) =>
      BAGS.find((b) => b.id === (id === "worn" ? "WORN" : id)) || {
        id: id,
        name: id,
        img: "",
      },
    legOf = () => LEGS.find((x) => x.id === LEG) || LEGS[0];

  /* ---------- sync ---------- */
  async function pushState(iid) {
    const s = ST[iid] || {};
    try {
      (await fetch(`${SB_URL}/rest/v1/pack_state`, {
        method: "POST",
        headers: Object.assign({}, HDRS, {
          "Content-Type": "application/json",
          Prefer: "resolution=merge-duplicates,return=minimal",
        }),
        body: JSON.stringify({ iid: iid, packed: !!s.packed, bag: s.bag || null }),
      }),
        (OFFLINE = !1));
    } catch (e) {
      OFFLINE = !0;
    }
  }
  async function pushItem(it) {
    try {
      await fetch(`${SB_URL}/rest/v1/pack_items`, {
        method: "POST",
        headers: Object.assign({}, HDRS, {
          "Content-Type": "application/json",
          Prefer: "resolution=merge-duplicates,return=minimal",
        }),
        body: JSON.stringify({ id: it.id, pos: 999, cat: it.cat, data: it }),
      });
    } catch (e) {}
  }
  async function load() {
    try {
      const r = await fetch(`${SB_URL}/rest/v1/pack_state?select=*`, {
        headers: HDRS,
        cache: "no-store",
      });
      if (!r.ok) throw 0;
      const rows = await r.json(),
        s = {};
      (rows.forEach((x) => (s[x.iid] = { packed: !!x.packed, bag: x.bag || null })),
        (ST = s),
        store.set("pack:state", s),
        (OFFLINE = !1));
    } catch (e) {
      OFFLINE = !0;
    }
    try {
      const r = await fetch(`${SB_URL}/rest/v1/pack_items?select=data`, {
        headers: HDRS,
        cache: "no-store",
      });
      if (r.ok) {
        const custom = (await r.json()).map((x) => x.data).filter(Boolean);
        (store.set("pack:custom", custom),
          (ITEMS = D.items.slice().concat(custom)));
      }
    } catch (e) {}
  }
  function tick(k) {
    const s = ST[k] || (ST[k] = {});
    ((s.packed = !s.packed), store.set("pack:state", ST), pushState(k), KEEPSCROLL(), render());
  }

  /* ---------- custom items ---------- */
  const customFor = (legId, bagId) =>
    ITEMS.filter((i) => i.legs && i.legs[legId] === bagId);
  const placedOn = (legId) => {
    const s = new Set();
    const l = LEGS.find((x) => x.id === legId);
    ((l.bags || []).forEach((b) =>
      (b.ids || []).forEach((x) => s.add(Array.isArray(x) ? x[0] : x)),
    ),
      ITEMS.forEach((i) => i.legs && i.legs[legId] && s.add(i.id)));
    return s;
  };
  const unplacedOn = (legId) => {
    const s = placedOn(legId);
    return ITEMS.filter((i) => !s.has(i.id));
  };

  function setAddBag(b) {
    ((ADDBAG = ADDBAG === b ? "" : b), KEEPSCROLL(), render());
  }
  function addSave() {
    const el = document.getElementById("pk-new"),
      name = (el && el.value || "").trim();
    if (!name) return;
    if (!ADDBAG) return;
    const id =
      "x-" +
      name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") +
      "-" +
      Date.now().toString(36).slice(-4);
    const from = LEGS.findIndex((x) => x.id === legOf().id),
      legs = {};
    LEGS.slice(Math.max(0, from)).forEach((l) => (legs[l.id] = ADDBAG));
    const it = {
      id: id,
      name: name,
      cat: "added",
      bag: ADDBAG,
      qty: 1,
      g: 0,
      fate: "always",
      note: "Added by you.",
      legs: legs,
    };
    ITEMS = ITEMS.concat([it]);
    store.set("pack:custom", store.get("pack:custom", []).concat([it]));
    (pushItem(it), (ADDBAG = ""), el && (el.value = ""), KEEPSCROLL(), render());
  }

  /* ---------- weights and counts ---------- */
  const rowsOf = (b) =>
    b.items.reduce((a, x) => a + (x.inside && x.inside.length ? x.inside.length : 1), 0) +
    customFor(legOf().id, b.bag).length;
  const key = (l, b, n, k) =>
    "plan:" + l.id + ":" + b.bag + ":" + n + (k == null ? "" : ":" + k);
  function doneOf(l, b) {
    let d = 0;
    (b.items.forEach((x, n) => {
      if (x.inside && x.inside.length)
        x.inside.forEach((y, k) => on(key(l, b, n, k)) && d++);
      else on(key(l, b, n)) && d++;
    }),
      customFor(l.id, b.bag).forEach((i) => packed(i) && d++));
    return d;
  }
  function gramsOf(l, b) {
    if ("left" === b.mode) return 0;
    const extra =
      customFor(l.id, b.bag).reduce((a, i) => a + (i.g || 0), 0) +
      (bagMeta(b.bag).empty || 0);
    if (b.ids && b.ids.length)
      return (
        extra +
        b.ids.reduce((a, e) => {
          const part = Array.isArray(e),
            i = ITEMS.find((x) => x.id === (part ? e[0] : e));
          if (!i) return a;
          const g = i.g || 0;
          return a + (part && i.qty ? (g * e[1]) / i.qty : g);
        }, 0)
      );
    return (
      extra +
      ITEMS.filter((i) => bagOf(i) === b.bag && !(l.stored && "store" === i.fate)).reduce(
        (a, i) => a + (i.g || 0),
        0,
      )
    );
  }
  const exact = (b) => !!(b.ids && b.ids.length) || "left" === b.mode;
  function progress(l) {
    let t = 0,
      d = 0;
    ((l.bags || []).forEach((b) => {
      "left" !== b.mode && ((t += rowsOf(b)), (d += doneOf(l, b)));
    }),
      (l.do || []).forEach((x, n) => {
        (t++, on("do:" + l.id + ":" + n) && d++);
      }));
    return { t: t, d: d, pc: t ? Math.round((d / t) * 100) : 0 };
  }

  /* ---------- rows ---------- */
  const parentOf = (i) => {
    if (!i.inbag) return null;
    const p = ITEMS.find((x) => x.id === i.inbag);
    return p && bagOf(p) === bagOf(i) ? p : null;
  };
  function kidsOf(pool) {
    const set = new Set(pool.map((i) => i.id)),
      k = {};
    return (
      pool.forEach((i) => {
        const p = parentOf(i);
        p && set.has(p.id) && ((k[p.id] = k[p.id] || []).push(i));
      }),
      k
    );
  }
  const nestedIds = (pool) =>
    new Set([].concat(...Object.values(kidsOf(pool))).map((i) => i.id));

  const pill = (i) =>
    (i.crit ? '<span class="pill crit">essential</span>' : "") +
    ("store" === i.fate ? '<span class="pill store">parks in Bangkok</span>' : "") +
    ("buy" === i.fate ? '<span class="pill buy">buy en route</span>' : "") +
    ("handover" === i.fate ? '<span class="pill hand">given away in Phuket</span>' : "");

  const itemRow = (i, extra, bare) =>
    `<div class="row${packed(i) ? " done" : ""}">
      <button class="tick${packed(i) ? " on" : ""}" onclick="PK.tick('${i.id}')" aria-label="packed">
        <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>
      <div class="rbody"><div class="rname">${esc(i.name)}${i.qty > 1 ? ` <span class="qty">×${i.qty}</span>` : ""}${extra || ""}</div>
        ${!bare && i.note ? `<div class="rnote">${esc(i.note)}</div>` : ""}
        <div class="rfoot">${pill(i)}</div></div></div>`;

  function listHTML(arr, pool) {
    const all = pool || arr,
      kids = kidsOf(all),
      nested = nestedIds(all);
    return arr
      .filter((i) => !nested.has(i.id))
      .map((i) => {
        const k = kids[i.id];
        if (!k || !k.length) return itemRow(i);
        const d = k.filter(packed).length;
        return (
          itemRow(i, `<span class="inside">${d}/${k.length} inside</span>`) +
          `<div class="kids">${k.map((x) => itemRow(x)).join("")}</div>`
        );
      })
      .join("");
  }

  /* A packing list is for ticking, not reading. Item names only — the
     reasoning still lives on the item in the full inventory. */
  const planRow = (l, b, x, n, k) => {
    const q = key(l, b, n, k);
    return `<div class="row${on(q) ? " done" : ""}" style="padding:10px 0">
      <button class="tick${on(q) ? " on" : ""}" onclick="PK.tick('${q}')" aria-label="packed">
        <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>
      <div class="rbody"><div class="rname">${esc(x.n)}</div></div></div>`;
  };

  /* ---------- views ---------- */
  function vBag(l, b) {
    const m = MODE[b.mode] || MODE.with,
      meta = bagMeta(b.bag),
      d = doneOf(l, b),
      rows = rowsOf(b),
      g = gramsOf(l, b),
      mine = customFor(l.id, b.bag);
    return `<button class="back" onclick="PK.back()">‹ ${esc(l.name)}</button>
      <div class="sec">
        <div class="sg-head"><h2>${esc(meta.name)}</h2><span class="n">${esc(l.dates)}</span></div>
        <div class="card" style="--bc:${COL[b.bag] || "var(--muted)"};margin-bottom:14px">
          <div class="bagtop">
            ${meta.img ? `<span class="bagph"><img src="${esc(meta.img)}" alt="" loading="lazy" onerror="this.closest('.bagph').classList.add('noimg')"></span>` : `<span class="bagic">${ICON[b.bag] || "👕"}</span>`}
            <span style="flex:1;min-width:0">
              <span class="sash ${m.cls}">${m.label}</span>
              <span class="bagmeta" style="display:block;margin-top:5px">${d} of ${rows} ticked${g ? " · " + (exact(b) ? "about " : "roughly ~") + kg(g) : ""}${bagMeta(b.bag).empty ? " · bag " + kg(bagMeta(b.bag).empty) : ""}</span>
            </span></div>
          <div class="fill" style="--bc:${COL[b.bag] || "var(--muted)"}"><i style="width:${rows ? (d / rows) * 100 : 0}%"></i></div>
        </div>
        <div class="card">
        ${b.items
          .filter((x) => !x.inside || !x.inside.length)
          .map((x) => planRow(l, b, x, b.items.indexOf(x)))
          .join("")}
        ${mine.map((i) => itemRow(i, "", !0)).join("")}
        </div>
        ${b.items
          .map((x, n) => {
            if (!x.inside || !x.inside.length) return "";
            const d2 = x.inside.filter((y, k) => on(key(l, b, n, k))).length;
            return `<div class="label" style="margin-top:16px">${esc(x.n)}
                <span class="inside">${d2}/${x.inside.length}</span></div>
              <div class="card">${x.inside.map((y, k) => planRow(l, b, y, n, k)).join("")}</div>`;
          })
          .join("")}
      </div>`;
  }

  function vLeg(l) {
    const pr = progress(l),
      unplaced = unplacedOn(l.id),
      tiles = (l.bags || [])
        .map((b, i) => {
          const m = MODE[b.mode] || MODE.with,
            meta = bagMeta(b.bag),
            d = doneOf(l, b),
            n = rowsOf(b),
            g = gramsOf(l, b);
          return `<button class="btile ${m.cls}${"left" === b.mode ? " off" : ""}" style="--bc:${COL[b.bag] || "var(--muted)"}" onclick="PK.openBag(${i})">
          <span class="sash ${m.cls}">${m.label}</span>
          <span class="btile-ph">${meta.img ? `<img src="${esc(meta.img)}" alt="" loading="lazy" onerror="this.closest('.btile-ph').classList.add('noimg')">` : `<i>${ICON[b.bag] || "👕"}</i>`}</span>
          <span class="btile-n">${esc(meta.name)}</span>
          <span class="btile-m">${"left" === b.mode ? "Left behind" : d + " / " + n}${g ? " · " + (exact(b) ? "" : "~") + kg(g) : ""}</span>
          ${"left" === b.mode ? "" : `<span class="btile-f"><i style="width:${n ? (d / n) * 100 : 0}%"></i></span>`}
        </button>`;
        })
        .join("");
    return `<div class="sec">
        <div class="legwhere" style="margin-bottom:4px">${esc(l.where)}</div>
        ${l.via ? `<div class="legvia">${esc(l.via)}</div>` : ""}
        <div class="card" style="margin:11px 0 14px">
          <div class="bagtop">
            <span style="flex:1"><span class="bagname" style="display:block">${pr.d} of ${pr.t} ticked</span>
            <span class="bagmeta">Tick as you pack${(() => {
              const t = (l.bags || []).reduce((a, b) => a + gramsOf(l, b), 0);
              return t ? " · about " + kg(t) + " all in" : "";
            })()}</span></span>
            <span class="bagpill${100 === pr.pc && pr.t ? " done" : ""}">${pr.pc}%</span></div>
          <div class="fill" style="--bc:var(--blue)"><i style="width:${pr.pc}%"></i></div>
          <div class="counthint">${pr.t} things to tick on this leg, covering all ${ITEMS.length} items you own — a line like "Cube 1" is one tick for several things.</div>
          ${(() => {
            /* The allowance, as two icons and a figure. What you are actually
               carrying is right above it; the comparison is the whole point. */
            const a = l.allow;
            if (!a) return "";
            return `<div class="allow">
              ${a.checked ? bagChip("checked", a.checked) : ""}
              ${a.cabin ? bagChip("cabin", a.cabin) : ""}
            </div>`;
          })()}
        </div>
        <div class="label">The bags</div>
        <div class="btiles">${tiles}</div>
        ${
          unplaced.length
            ? `<div class="alert"><b>${unplaced.length} not placed on this leg</b><p>${unplaced
                .slice(0, 14)
                .map((i) => esc(i.name))
                .join(", ")}${unplaced.length > 14 ? ", and " + (unplaced.length - 14) + " more" : ""}.</p></div>`
            : `<div class="covered">✓ All ${ITEMS.length} things you own are placed on this leg</div>`
        }
        ${
          (l.bags || []).some((b) => !exact(b))
            ? '<div class="alert info"><b>Weights here are rough</b><p>This leg has not been worked through item by item yet, so the figures come from where things live by default.</p></div>'
            : ""
        }
        ${
          (l.do || []).length
            ? `<div class="label">Before this leg</div><div class="card">
          ${l.do
            .map((x, n) => {
              const k = "do:" + l.id + ":" + n;
              return `<div class="row${on(k) ? " done" : ""}" style="padding:10px 0">
              <button class="tick${on(k) ? " on" : ""}" onclick="PK.tick('${k}')" aria-label="done">
                <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>
              <div class="rbody"><div class="rname">${esc(x.n)}</div>
                ${x.note ? `<div class="rnote">${esc(x.note)}</div>` : ""}</div></div>`;
            })
            .join("")}
          </div>`
            : ""
        }
      </div>`;
  }

  function vAll() {
    const q = Q.toLowerCase(),
      list = ITEMS.filter(
        (i) =>
          !q ||
          i.name.toLowerCase().includes(q) ||
          (i.note || "").toLowerCase().includes(q) ||
          i.cat.includes(q),
      ),
      nst = nestedIds(list),
      cats = {};
    list.forEach((i) => {
      nst.has(i.id) || (cats[i.cat] = cats[i.cat] || []).push(i);
    });
    return `<button class="back" onclick="PK.back()">‹ Packing</button>
      <input class="search" id="pk-q" placeholder="Search everything…" value="${esc(Q)}"
        oninput="PK.search(this.value)">
      <div class="sec">${
        Object.keys(cats).length
          ? Object.keys(cats)
              .map(
                (c) =>
                  `<div class="catline">${CATICON[c] || "•"} ${esc(c)} <span></span></div>` +
                  listHTML(cats[c], list),
              )
              .join("")
          : '<div class="center">Nothing matches.</div>'
      }</div>`;
  }

  function vDay(d) {
    return `<button class="back" onclick="PK.back()">‹ Packing</button>
      <div class="sec"><div class="sg-head"><h2>${esc(d.name)}</h2><span class="n">${esc(d.dates)}</span></div>
      <div class="legwhere" style="margin-bottom:11px">${esc(d.where)}</div>
      <div class="card" style="margin-bottom:14px"><div class="note">${esc(d.note)}</div></div>
      ${d.warn ? `<div class="alert"><b>Worth knowing</b><p>${esc(d.warn)}</p></div>` : ""}
      <div class="card">${d.items
        .map((i, n) => {
          const k = "day:" + d.id + ":" + n;
          return `<div class="row${on(k) ? " done" : ""}" style="padding:10px 0">
          <button class="tick${on(k) ? " on" : ""}" onclick="PK.tick('${k}')" aria-label="packed">
            <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>
          <div class="rbody"><div class="rname">${esc(i.name)}${i.crit ? ' <span class="pill crit">don\'t skip</span>' : ""}</div></div></div>`;
        })
        .join("")}</div></div>`;
  }

  function vShop(sh) {
    return `<button class="back" onclick="PK.back()">‹ Packing</button>
      <div class="sec"><div class="sg-head"><h2>${esc(sh.name)}</h2><span class="n">${esc(sh.when)}</span></div>
      <div class="legwhere" style="margin-bottom:11px">${esc(sh.where)}</div>
      <div class="card" style="margin-bottom:14px"><div class="note">${esc(sh.note)}</div></div>
      <div class="card">${sh.items
        .map((i, n) => {
          const k = "shop:" + sh.id + ":" + n;
          return `<div class="row${on(k) ? " done" : ""}" style="padding:10px 0">
          <button class="tick${on(k) ? " on" : ""}" onclick="PK.tick('${k}')" aria-label="bought">
            <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>
          <div class="rbody"><div class="rname">${esc(i.name)}${i.crit ? ' <span class="pill crit">don\'t skip</span>' : ""}</div></div></div>`;
        })
        .join("")}</div></div>`;
  }

  function view() {
    const l = legOf();
    if (!l) return '<div class="center">No legs defined.</div>';
    if ("bag" === VIEW && l.bags && l.bags[OPENBAG]) return vBag(l, l.bags[OPENBAG]);
    if ("all" === VIEW) return vAll();
    if ("day" === VIEW) {
      const d = DAYBAGS.find((x) => x.id === OPENDAY);
      if (d) return vDay(d);
    }
    if ("shop" === VIEW) {
      const sh = SHOPPING.find((x) => x.id === OPENSHOP);
      if (sh) return vShop(sh);
    }
    const from = LEGS.findIndex((x) => x.id === l.id),
      rest = LEGS.slice(Math.max(0, from));
    return (
      `<div class="legpick">
        <select onchange="PK.setLeg(this.value)" aria-label="Which leg">
          ${LEGS.map((x) => `<option value="${x.id}"${x.id === l.id ? " selected" : ""}>${esc(x.name)} · ${esc(x.dates)}</option>`).join("")}
        </select>
        <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </div>` +
      vLeg(l) +
      `<div class="sec">
        ${
          DAYBAGS.length
            ? `<div class="label">Day bags</div>
          ${DAYBAGS.map(
            (d) => `<button class="daycard" onclick="PK.openDay('${d.id}')">
            <div class="dayhead"><span>
              <span class="bagname" style="display:block">${esc(d.name)}</span>
              <span class="bagmeta">${esc(d.bag)} · ${d.items.length} things</span></span>
              <span class="bagpill">${esc(d.dates)}</span></div>
            <div class="bagnote">${esc(d.where)}</div></button>`,
          ).join("")}`
            : ""
        }
        ${
          SHOPPING.length
            ? `<div class="label">Buy on arrival</div>
          ${SHOPPING.map(
            (sh) => `<button class="daycard" onclick="PK.openShop('${sh.id}')">
            <div class="dayhead"><span>
              <span class="bagname" style="display:block">${esc(sh.name)}</span>
              <span class="bagmeta">${esc(sh.where)} · ${sh.items.length} things</span></span>
              <span class="bagpill">${esc(sh.when)}</span></div></button>`,
          ).join("")}`
            : ""
        }

        <div class="label">Everything</div>
        <button class="daycard" onclick="PK.openAll()">
          <div class="dayhead"><span>
            <span class="bagname" style="display:block">Full inventory</span>
            <span class="bagmeta">${ITEMS.length} items · ${kg(ITEMS.reduce((a, i) => a + (i.g || 0), 0))} all in</span></span>
            <span class="bagpill">${ITEMS.filter(packed).length}/${ITEMS.length}</span></div>
          <div class="bagnote">Search everything you are taking, in one list.</div></button>

        <div class="label">Missing something?</div>
        <div class="card"><div class="colhead">Add an item</div>
          <div class="colsub">Pick the bag it goes in. It is added to ${rest.length === LEGS.length ? "every leg" : "this leg and the " + (rest.length - 1) + " after it"}, and to the full inventory.</div>
          <div class="addrow"><input id="pk-new" placeholder="e.g. snorkel mask"></div>
          <div class="pickbags">${BAGS.map(
            (b) =>
              `<button class="pickbag${ADDBAG === b.id ? " on" : ""}" style="--bc:${COL[b.id] || "var(--muted)"}" onclick="PK.setAddBag('${b.id}')">
              <span class="pbox"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>${esc(b.name)}</button>`,
          ).join("")}</div>
          <div class="addrow" style="margin-top:11px"><button class="addgo${ADDBAG ? "" : " off"}" onclick="PK.addSave()">Add to ${ADDBAG ? esc(bagMeta(ADDBAG).name) : "…"}</button></div>
        </div>
        ${OFFLINE ? '<div class="note" style="margin-top:14px">Saved on this device — no connection when this loaded.</div>' : ""}
      </div>`
    );
  }

  return {
    view: view,
    load: load,
    /* For the home screen: how far through the leg you are currently packing. */
    progress: function () {
      const l = legOf();
      if (!l) return null;
      const p = progress(l);
      return { name: l.name, t: p.t, d: p.d, pc: p.pc };
    },
    tick: tick,
    setAddBag: setAddBag,
    addSave: addSave,
    setLeg: function (id) {
      ((LEG = id), store.set("pack:leg", id), (VIEW = "leg"), (OPENBAG = null), (KEEPY = 0), render());
    },
    openBag: function (i) {
      ((OPENBAG = i), (VIEW = "bag"), (KEEPY = 0), render());
    },
    openDay: function (id) {
      ((OPENDAY = id), (VIEW = "day"), (KEEPY = 0), render());
    },
    openShop: function (id) {
      ((OPENSHOP = id), (VIEW = "shop"), (KEEPY = 0), render());
    },
    openAll: function () {
      ((VIEW = "all"), (KEEPY = 0), render());
    },
    back: function () {
      ((VIEW = "leg"), (OPENBAG = null), (KEEPY = 0), render());
    },
    search: function (v) {
      ((Q = v), KEEPSCROLL(), render());
      const e = document.getElementById("pk-q");
      e && (e.focus(), e.setSelectionRange(e.value.length, e.value.length));
    },
    reset: function () {
      ((VIEW = "leg"), (OPENBAG = null), (Q = ""));
    },
  };
})();
</script>
<script>
/* Started here rather than at the end of app.js so the packing module is
   defined before the first render reaches for it. */
/* The hero pins just below the header, so the header's real height has to be
   a number the stylesheet can use. */
const headH = () => {
  const h = document.querySelector("header");
  h && document.documentElement.style.setProperty("--headH", h.offsetHeight + "px");
};
headH();
addEventListener("resize", headH);
/* Which build is actually on screen. Worth having when a phone is quietly
   serving an older copy and the fix "did not work". */
fetch("version.txt?t=" + Date.now(), { cache: "no-store" })
  .then((r) => r.text())
  .then((t) => {
    window.BUILD = t.split("\n")[0].trim();
    const e = document.getElementById("bver");
    e && (e.textContent = "Build " + window.BUILD);
  })
  .catch(() => {});
addEventListener("orientationchange", () => setTimeout(headH, 250));

((document.getElementById("fxhost").innerHTML = fxBox()),
  (document.getElementById("nfhost").innerHTML = notifBox()),
  fxPaint(),
  boot(),
  "serviceWorker" in navigator && navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>

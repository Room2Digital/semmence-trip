<!DOCTYPE html>
<html lang="en">
<head>

<title>Australia &amp; Thailand</title>
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>html,
body {
  margin: 0;
  background: #0d0d0d;
  color: #f5f3ee;
  font-family:
    -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
</style>
<style id="appcss">:root {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #222220;
  --ink: #fff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --baseline: #383835;
  --ring: rgba(255, 255, 255, 0.1);
  --blue: #3987e5;
  --magenta: #d55181;
  --violet: #9085e9;
  --aqua: #199e70;
  --yellow: #c98500;
  --orange: #d95926;
  --good: #0ca30c;
  --land: #242421;
  --land-stroke: #3a3a36;
  --sea: #111113;
  --radius: 14px;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --heroH: clamp(196px, 56vw, 330px);
  --sat: env(safe-area-inset-top);
  --sab: env(safe-area-inset-bottom);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  /* No overflow here on purpose. When html and body BOTH set an overflow,
     body stops propagating to the viewport and becomes a scroll container
     of its own — and iOS Safari then resolves every position:sticky inside
     it against that box, which never scrolls. Setting it on body alone
     propagates up and still clips sideways. */
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  min-height: 100%;
  min-height: 100dvh;
}
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(76px + var(--sab));
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  touch-action: pan-x pan-y;
  width: 100%;
  max-width: 100%;
  /* hidden, not clip: the body-to-viewport propagation that keeps body itself
     a normal block (and therefore keeps position:sticky working inside it) is
     long-established for hidden and unreliable on iOS for clip. */
  overflow-x: hidden;
}
header,
nav {
  max-width: 100%;
  overflow-x: clip;
}
/* #view deliberately has no overflow of its own: iOS Safari turns a clipped
   axis into a scroll container, which stops position:sticky working for
   anything inside it. html and body already clip horizontally. */
#view {
  max-width: 100%;
}
.cal-day,
.cal-grid,
.i-flag,
.i-walk,
.iacts,
.ibtn,
.ichips,
.ilink,
.lchip,
.mapbtn,
.mchip,
.mv-foot,
.mv-head,
.scroller,
.seg,
.sh-grab,
.subseg,
button,
header,
nav,
summary {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
img:not(.gm-style img) {
  -webkit-touch-callout: none;
  -webkit-user-drag: none;
  user-drag: none;
}
[contenteditable],
input,
select,
textarea {
  -webkit-user-select: text;
  user-select: text;
}
.scroller,
.seg,
.sh-panel,
.subseg {
  -webkit-overflow-scrolling: touch;
}
.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 16px;
}
header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(13, 13, 13, 0.86);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--grid);
  padding: calc(10px + var(--sat)) 0 10px;
}
.kicker {
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
h1.title {
  font-size: clamp(21px, 5vw, 30px);
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-top: 2px;
}
h1.title .au {
  color: var(--blue);
}
h1.title .amp {
  color: var(--muted);
  font-weight: 300;
}
h1.title .th {
  color: var(--orange);
}
.toggle {
  display: inline-flex;
  background: var(--surface);
  border: 1px solid var(--ring);
  border-radius: 999px;
  padding: 3px;
  margin-top: 10px;
  width: 100%;
}
.toggle button {
  flex: 1;
  border: 0;
  background: 0 0;
  color: var(--ink-2);
  font: 600 12.5px var(--font);
  padding: 7px 6px;
  border-radius: 999px;
  cursor: pointer;
  transition: 0.15s;
  white-space: nowrap;
}
.toggle button.active {
  background: var(--surface-2);
  color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--ring);
}
.toggle .tdot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 5px;
  vertical-align: middle;
}
.hrow {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.htxt {
  flex: 1;
  min-width: 0;
}
.fxbtn {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  width: 44px;
  height: 44px;
  margin-top: 2px;
  border-radius: 13px;
  border: 1px solid var(--ring);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  font-family: var(--font);
}
.fxbtn:active {
  background: var(--surface-2);
  transform: scale(0.95);
}
.fxbtn svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: var(--aqua);
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.fxbtn span {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.02em;
  color: var(--ink-2);
  line-height: 1;
}
.modal {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: none;
  align-items: center;
  justify-content: center;
  padding: calc(22px + var(--sat)) 22px calc(22px + var(--sab));
  background: rgba(0, 0, 0, 0.66);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
}
.modal.open {
  display: flex;
}
.mbox {
  position: relative;
  width: 100%;
  max-width: 322px;
  max-height: 82vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--surface);
  border: 1px solid var(--ring);
  border-radius: 20px;
  padding: 17px 18px 19px;
  box-shadow: 0 22px 64px rgba(0, 0, 0, 0.62);
}
.mx {
  position: absolute;
  top: 11px;
  right: 11px;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  border: 1px solid var(--ring);
  background: var(--surface-2);
  color: var(--ink);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
.fxpairs {
  display: flex;
  gap: 6px;
  margin-top: 11px;
}
.fxpair {
  flex: 1;
  border: 1px solid var(--ring);
  background: var(--page);
  color: var(--ink-2);
  border-radius: 11px;
  padding: 8px 6px;
  font: 600 12.5px var(--font);
  cursor: pointer;
}
.fxpair.on {
  background: var(--surface-2);
  color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--ring);
}
.fxdir {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 14px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--ink-2);
}
.fxswap {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--ring);
  background: var(--surface-2);
  color: var(--aqua);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
}
.fxswap:active {
  transform: rotate(180deg);
}
.fxfield {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  background: var(--page);
  border: 1px solid var(--ring);
  border-radius: 13px;
  padding: 11px 13px;
}
.fxsym {
  font-size: 19px;
  font-weight: 700;
  color: var(--muted);
}
.fxfield input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: 0 0;
  color: var(--ink);
  font: 800 24px var(--font);
  letter-spacing: -0.02em;
  outline: 0;
  padding: 0;
}
.fxres {
  display: flex;
  align-items: baseline;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 12px;
  min-height: 34px;
}
.fxq {
  font-size: 12.5px;
  color: var(--muted);
}
.fxres b {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--aqua);
}
.fxtable {
  margin-top: 13px;
  border-top: 1px solid var(--grid);
  padding-top: 9px;
}
.fxr {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 13px;
  color: var(--muted);
}
.fxr b {
  color: var(--ink-2);
  font-weight: 700;
}
.fxrate {
  margin-top: 11px;
  font-size: 12.5px;
  color: var(--ink-2);
  text-align: center;
}
.fxwhen {
  margin-top: 3px;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  line-height: 1.4;
}
nav.tabs {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  display: flex;
  background: rgba(13, 13, 13, 0.92);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--grid);
  padding-bottom: var(--sab);
}
nav.tabs button {
  flex: 1;
  border: 0;
  background: 0 0;
  color: var(--muted);
  font: 600 10px var(--font);
  padding: 9px 2px 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  border-top: 2px solid transparent;
  margin-top: -1px;
}
nav.tabs button[aria-current="true"] {
  color: var(--ink);
  border-top-color: var(--blue);
}
nav.tabs svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
section.sec {
  padding: 22px 0 2px;
}
.sg-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.sg-head h2 {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.01em;
}
.sg-head .n {
  color: var(--muted);
  font-size: 12px;
}
.label {
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
  margin: 18px 0 9px;
}
.chip {
  background: var(--surface);
  border: 1px solid var(--ring);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12.5px;
  color: var(--ink-2);
  display: inline-flex;
  gap: 6px;
  align-items: center;
}
.chip b {
  color: var(--ink);
  font-weight: 700;
}
.chip .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.hero-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.card.cdw {
  position: relative;
  overflow: hidden;
  text-align: center;
  padding: 19px 16px 17px;
  border-color: rgba(57, 135, 229, 0.34);
  background:
    radial-gradient(
      115% 135% at 50% -18%,
      rgba(57, 135, 229, 0.34),
      transparent 60%
    ),
    linear-gradient(165deg, var(--surface-2), var(--surface));
}
.card.cdw::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(57, 135, 229, 0.8),
    transparent
  );
}
.cd-top {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}
.cd-top .kicker {
  letter-spacing: 0.2em;
}
.cd-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 0 0 0 rgba(57, 135, 229, 0.6);
  animation: 2.4s ease-out infinite cdp;
}
@keyframes cdp {
  0% {
    box-shadow: 0 0 0 0 rgba(57, 135, 229, 0.55);
  }
  70% {
    box-shadow: 0 0 0 7px rgba(57, 135, 229, 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(57, 135, 229, 0);
  }
}
.cd-route {
  font-size: 17px;
  font-weight: 700;
  margin-top: 6px;
  line-height: 1.25;
  letter-spacing: -0.015em;
}
.cdgrid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  margin-top: 15px;
}
.cdu {
  background: rgba(0, 0, 0, 0.36);
  border: 1px solid var(--ring);
  border-radius: 13px;
  padding: 12px 3px 9px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
}
.cdu b {
  display: block;
  font-size: 27px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--ink);
}
.cdu i {
  display: block;
  font-style: normal;
  font-size: 8.5px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 7px;
}
.cd-when {
  font-size: 12.5px;
  color: var(--ink-2);
  margin-top: 12px;
}
.backbar {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 14px 0 2px;
}
.backbar button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--ring);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 999px;
  padding: 6px 13px 6px 9px;
  font: 600 12.5px var(--font);
  cursor: pointer;
}
.backbar button svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.backbar span {
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}
.infob {
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
  text-align: left;
  cursor: pointer;
  background: var(--surface);
  border: 1px solid var(--ring);
  border-radius: var(--radius);
  padding: 14px 15px;
  color: var(--ink);
  font-family: var(--font);
}
.infob:active {
  background: var(--surface-2);
}
.infob > svg:first-child {
  width: 21px;
  height: 21px;
  flex: 0 0 auto;
  fill: none;
  stroke: var(--muted);
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.infob span {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.infob b {
  font-size: 14.5px;
  font-weight: 700;
}
.infob i {
  font-style: normal;
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 2px;
}
.s-inout {
  display: flex;
  gap: 22px;
  margin-top: 9px;
}
.s-inout span {
  font-size: 14px;
  font-weight: 700;
}
.s-inout i {
  display: block;
  font-style: normal;
  font-size: 10px;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
  margin-bottom: 2px;
}
.tapc {
  cursor: pointer;
}
.tapc:active {
  filter: brightness(1.15);
}
.se-name {
  font-size: 16px;
  font-weight: 750;
  margin-top: 5px;
}
.se-l {
  display: block;
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
  margin: 14px 0 5px;
}
.se-i {
  width: 100%;
  border: 1px solid var(--ring);
  background: var(--page);
  color: var(--ink);
  border-radius: 11px;
  padding: 11px 12px;
  font: 500 15px var(--font);
  outline: 0;
}

.se-btns {

.jrn {

}

}

}
.jrn-main {
  flex: 1;

}
.jrn-route {
  font-size: 16.5px;

}
.jrn-route span {

}
.jrn-when {

}
.jrn-tbc {

}
.jrn-next {

.jrn-caret {

.jrn-t {

.jrn-x b {

  font-size: 13.5px;

  color: var(--ink-2);
}
.jrn-x i {

  font-style: normal;
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 1px;
}
.dayh {

    transform 0.12s,
    filter 0.15s;

  filter: brightness(1.15);
}

.dh-head {

.dh-where {

.dh-list {

.dh-t {

  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.dh-l {

  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 4px;
  font-weight: 700;
}
.br p {
  margin: 0;
  font-size: 13.5px;
  line-height: 1.55;
}
.br ul {
  margin: 0;
  padding-left: 17px;
}
.br li {
  font-size: 13.5px;
  line-height: 1.55;
  margin-bottom: 4px;
}
.br.warn h4 {
  color: var(--orange);
}
.scroller {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding: 2px 16px 9px;
  margin: 0 -16px;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
}
.scroller::-webkit-scrollbar {
  display: none;
}
.lchip {
  flex: 0 0 auto;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--ring);
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 12.5px;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
}
.lchip.on {
  background: var(--ink);
  color: var(--page);
  border-color: var(--ink);
  font-weight: 600;
}
.seg {
  display: flex;
  gap: 4px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--ring);
  border-radius: 11px;
  padding: 3px;
  margin-bottom: 12px;
  overflow-x: auto;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
  max-width: 100%;
}
.seg::-webkit-scrollbar {
  display: none;
}
.seg button {
  flex: 1 0 auto;
  white-space: nowrap;
  background: 0 0;
  border: 0;
  color: var(--muted);
  font: inherit;
  font-size: 12.5px;
  padding: 7px 11px;
  border-radius: 8px;
  cursor: pointer;
}
.seg button.on {
  background: var(--surface-2);
  color: var(--ink);
  font-weight: 600;
}
.idea .why {
  font-size: 12.5px;
  line-height: 1.5;
  color: #cfc9bd;
  border-left: 2px solid var(--ring);
  padding-left: 9px;
  margin-top: 9px;
}
.card.idea {
  padding: 0;
  overflow: hidden;
}
.i-hero {
  height: 132px;
  position: relative;
  display: flex;
  align-items: flex-end;
  padding: 10px 15px;
  background: linear-gradient(135deg, #2a2a27, #15150f);
}
.i-hero img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.i-hero .scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(13, 13, 13, 0.05) 25%,
    rgba(13, 13, 13, 0.88)
  );
}
.i-walk {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 2;
  background: var(--good);
  color: #0b0b0b;
  font-size: 10.5px;
  font-weight: 650;
  line-height: 1;
  letter-spacing: 0.02em;
  padding: 5px 9px;
  border-radius: 0 0 10px;
  box-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
}
.i-hero .cap {
  position: relative;
  font-size: 15.5px;
  font-weight: 650;
  line-height: 1.25;
  color: #fff;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
}
.i-tags {
  position: absolute;
  top: 9px;
  right: 12px;
  z-index: 2;
  display: flex;
  gap: 6px;
  align-items: center;
  max-width: calc(100% - 96px);
  flex-wrap: wrap;
  justify-content: flex-end;
}
.i-flag,
.i-when {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 999px;
  background: rgba(13, 13, 13, 0.7);
  border: 1px solid var(--ring);
  color: var(--ink-2);
  white-space: nowrap;
  color: #e0d9c8;
}
.i-flag.good {
  color: #7fd39b;
  border-color: rgba(12, 163, 12, 0.5);
}
.i-body {
  padding: 12px 16px 14px;
}
.i-meta {
  font-size: 12px;
  color: var(--muted);
}
.ichips {
  margin-top: 9px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.mchip.star {
  color: #e8c87b;
  border-color: rgba(232, 200, 123, 0.32);
}
.mchip.star i {
  font-style: normal;
  opacity: 0.6;
  margin-left: 5px;
  font-size: 10.5px;
}
.i-dist {
  margin-top: 9px;
  font-size: 12px;
  color: var(--ink-2);
  display: flex;
  gap: 6px;
  align-items: flex-start;
  line-height: 1.45;
}
.i-dist:before {
  content: "→";
  opacity: 0.5;
  flex: 0 0 auto;
}
.subseg {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  margin: -4px 0 12px;
  padding-bottom: 2px;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
  max-width: 100%;
}
.subseg::-webkit-scrollbar {
  display: none;
}
.subseg button {
  flex: 0 0 auto;
  background: 0 0;
  border: 1px solid var(--ring);
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
}
.subseg button.on {
  background: var(--surface-2);
  color: var(--ink);
  border-color: var(--baseline);
  font-weight: 600;
}
.subseg button span {
  opacity: 0.55;
  margin-left: 3px;
}
.dgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.dtile {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1/1.12;
  padding: 0;
  cursor: pointer;
  text-align: left;
  border: 1px solid var(--ring);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
  color: inherit;
  font: inherit;
}
.dtile img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.dtile .dt-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(13, 13, 13, 0.1) 28%,
    rgba(13, 13, 13, 0.55) 62%,
    rgba(13, 13, 13, 0.93)
  );
}
.dtile .dt-txt {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 11px 12px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}
.dtile b {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.18;
  color: #fff;
  text-shadow: 0 1px 7px rgba(0, 0, 0, 0.65);
}
.dtile i {
  font-style: normal;
  font-size: 10.5px;
  color: rgba(255, 255, 255, 0.82);
  text-shadow: 0 1px 5px rgba(0, 0, 0, 0.6);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.dtile .dt-chips {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 5px;
}
.dtile em {
  font-style: normal;
  font-size: 10.5px;
  line-height: 1;
  padding: 4px 7px;
  border-radius: 999px;
  color: #fff;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.22);
}
.dtile em.good {
  color: #8fdca6;
  border-color: rgba(127, 211, 155, 0.45);
}
.dtile em.dim {
  color: rgba(255, 255, 255, 0.6);
  border-style: dashed;
}
.dtile.noimg {
  background: linear-gradient(155deg, var(--surface-2), var(--surface));
}
.dtile.noimg img {
  display: none;
}
.ptabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--grid);
  margin: 0 0 14px;
}
.ptabs button {
  flex: 1;
  background: 0 0;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  color: var(--muted);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 11px 6px;
  cursor: pointer;
}
.ptabs button.on {
  color: var(--ink);
  border-bottom-color: var(--ink);
}
.ptabs button span {
  font-size: 11.5px;
  font-weight: 500;
  opacity: 0.55;
  margin-left: 5px;
}
.btnrow {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 9px;
}
.addbtn {
  background: 0 0;
  border: 1px dashed var(--baseline);
  color: var(--ink-2);
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  padding: 7px 12px;
  border-radius: 999px;
  cursor: pointer;
}
.addbtn:active {
  background: var(--surface-2);
  color: var(--ink);
}
.mchip.idea {
  color: #c9b6f2;
  border-color: rgba(144, 133, 233, 0.45);
  border-style: dashed;
}
.fld2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.fld2 .fld {
  margin-top: 12px;

}
.fld2 .fld:first-child {

}
.fld2 input {
  min-width: 0;
  width: 100%;
}
.fld label i {
  font-style: normal;
  font-weight: 400;
  color: var(--muted);
  margin-left: 5px;
  font-size: 11px;
}
.fld select {
  background: var(--page);
  border: 1px solid var(--ring);
  color: var(--ink);
  font: inherit;
  -webkit-appearance: none;

}
.fhint {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 6px;
  line-height: 1.4;
}
.fhint.bad {
  color: #f0a08f;
}
.imgrow {
  display: flex;
  gap: 7px;
  align-items: center;
  margin-bottom: 7px;
}
.imgup {
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  background: var(--surface-2);
  border: 1px solid var(--ring);
  color: var(--ink);
  font-size: 12.5px;
  font-weight: 600;
  padding: 9px 14px;
  border-radius: 999px;
  cursor: pointer;
}
.imgup input {
  position: absolute;
  inset: 0;
  opacity: 0;

  height: 100%;
  cursor: pointer;
}
.imgclr {
  background: 0 0;
  border: 1px solid var(--ring);
  color: var(--muted);

  cursor: pointer;
}

  background: linear-gradient(150deg, var(--surface-2), var(--surface));
}
.backbar .imgtog {
  margin-left: auto;
}
.imgtog {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: 0 0;
  border: 1px solid var(--ring);
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  padding: 7px 12px;
  border-radius: 999px;
  cursor: pointer;
}
.imgtog svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.imgtog:active {
  background: var(--surface-2);
  color: var(--ink);
}
.calbar {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  color: var(--ink);
  font: inherit;
  padding: 14px 16px;
  cursor: pointer;
  text-align: left;
  margin-bottom: 14px;
}
.calbar:active {
  filter: brightness(1.2);
}
.calbar b {
  flex: 1;
  font-size: 14.5px;
  font-weight: 650;
}
.calbar > svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: var(--muted);
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: 0 0 auto;
}
.calgo {
  opacity: 0.5;
}
#calpop .mbox {
  max-width: 352px;
}
#calpop .kicker {
  margin-bottom: 12px;
}
#calpop .note {
  margin-top: 11px;
  font-size: 11.5px;
}
.calhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 9px;
}
.cal-nav {

  border: 1px solid var(--ring);
  color: var(--ink);

}
.cal-day:disabled {

}

  background: var(--ink-2);

.dgroup {

  color: var(--muted);
}

  color: var(--ink);
}
.av {
  list-style: none;

  padding: 0;
}
.av li {
  display: flex;
  gap: 10px;

  padding: 5px 0;
  border-bottom: 1px solid var(--grid);
  line-height: 1.4;
}
.av li:last-child {
  border-bottom: 0;
}
.av li .t {
  flex: 0 0 46px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.av-dur,
.av-free,
.av-none {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}
.av-free {
  color: #7fd39b;
}
.av-dur {
  margin-top: 8px;
  padding-top: 8px;

}
.imgnote {
  margin: 12px 0 0;
  font-size: 11.5px;
  line-height: 1.45;
  color: var(--muted);
  opacity: 0.8;
}
.iacts {
  display: flex;
  gap: 7px;

  margin-top: 11px;
  align-items: center;
}
.ilink {

  color: var(--muted);

  border: 1px solid var(--ring);
  border-radius: 999px;
  padding: 5px 11px;
}
.ilink:hover {
  color: var(--ink);
}
.ibtn {
  margin-left: auto;
  background: var(--ink);
  color: var(--page);
  border: 0;
  border-radius: 999px;
  padding: 7px 15px;
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
}
.ibtn.on {
  background: rgba(12, 163, 12, 0.18);

}
.fld {
  margin-top: 11px;
}
.fld label {
  display: block;
  font-size: 11px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 5px;
  font-weight: 700;
}
.fld input,
.fld select,
.fld textarea {
  width: 100%;

  background: var(--surface-2);

  border: 1px solid var(--ring);
  border-radius: 10px;
  padding: 10px 11px;
  font: inherit;
  font-size: 14px;
}
.fld textarea {
  min-height: 64px;

}
.pick3 {
  display: flex;
  gap: 6px;
}
.pick3 button {
  flex: 1;
  background: var(--surface-2);
  border: 1px solid var(--ring);
  color: var(--muted);
  border-radius: 10px;
  padding: 9px 4px;
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
}

  background: var(--ink);
  color: var(--page);

}

}

  border-color: var(--ink);
}
.shbtns .rm {
  background: 0 0;

  padding: 12px 16px;
}
.saving {

}
.deck {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 12px;
}

  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;

  letter-spacing: 0.06em;
  text-transform: uppercase;
}

}

  letter-spacing: 0.1em;

a {

@media (min-width: 760px) {

    padding: 26px 0 2px;
  }
  .card {
    padding: 17px 19px;
    margin-bottom: 12px;
  }

    width: auto;

  }

    padding: 8px 22px;

  }
  .title {
    font-size: 30px;
  }

  background:var(--surface);border:1px solid var(--ring);border-radius:15px;padding:13px 13px 14px;
  color:inherit;font:inherit;text-align:left;cursor:pointer;overflow:hidden;
  transition:transform .13s,border-color .15s}
.pk .btile:active{transform:scale(.985)}
.pk .btile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bc)}
.pk .btile.off{opacity:.45}
.pk .btile-ph{width:100%;aspect-ratio:1/1;border-radius:11px;overflow:hidden;background:#f4f4f2;
  display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--bc) 30%,transparent)}
.pk .btile-ph img{width:100%;height:100%;object-fit:cover;display:block}
.pk .btile-ph.noimg{background:color-mix(in srgb,var(--bc) 16%,transparent)}
.pk .btile-ph.noimg img{display:none}
.pk .btile-ph i{font-size:30px;font-style:normal}
.pk .btile-n{font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.pk .btile-m{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-4px}
.pk .btile-f{display:block;width:100%;height:3px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.pk .btile-f i{display:block;height:100%;border-radius:999px;background:var(--bc)}
.pk .atag{margin-top:10px;font-size:11px;letter-spacing:.04em;color:var(--muted);
  display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.pk .atag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good,#5dd692);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--good,#5dd692) 22%,transparent)}
.pk .subnote{font-size:12px;color:var(--ink-2);line-height:1.5;margin:-4px 0 8px}
.pk .covered{margin-top:11px;font-size:12px;color:#7fe0ad;text-align:center;
  background:rgba(93,214,146,.1);border:1px solid rgba(93,214,146,.26);
  border-radius:10px;padding:8px 10px}
/* ---------- repack ---------- */
.pk .split{display:grid;gap:12px}
.pk .col{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:16px 17px}
.pk .col.stay{border-color:rgba(155,140,244,.32);background:linear-gradient(170deg,rgba(155,140,244,.07),var(--surface) 58%)}
.pk .col.come{border-color:rgba(43,182,115,.32);background:linear-gradient(170deg,rgba(43,182,115,.07),var(--surface) 58%)}
.pk .colhead{font-size:14px;font-weight:750;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.pk .colsub{font-size:11.5px;color:var(--muted);margin:4px 0 13px}
.pk .mini{font-size:13px;padding:8px 0;border-bottom:1px solid var(--grid);display:flex;
  justify-content:space-between;gap:10px;align-items:baseline}
.pk .mini:last-child{border-bottom:0}
.pk .mini b{font-weight:500;color:var(--ink)}
.pk .mini span{color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.05em;white-space:nowrap}
/* ---------- callouts ---------- */
.pk .alert{border-radius:var(--r);padding:15px 16px;margin-bottom:16px;
  background:rgba(255,122,69,.09);border:1px solid rgba(255,122,69,.32)}
.pk .alert b{color:var(--orange);font-size:14px;letter-spacing:-.01em}
.pk .alert p{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.55}
.pk .alert.info{background:rgba(74,158,255,.08);border-color:rgba(74,158,255,.28)}
.pk .alert.info b{color:var(--blue)}
/* ---------- day bags ---------- */
.pk .daycard{display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--ring);border-radius:var(--r);padding:16px 17px;color:inherit;font:inherit;
  cursor:pointer;position:relative;overflow:hidden;transition:transform .13s}
.pk .daycard:active{transform:scale(.988)}
.pk .daycard::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,122,69,.12),transparent 60%)}
.pk .dayhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;position:relative;z-index:1}
/* ---------- misc ---------- */
.pk .search{width:100%;background:var(--surface);border:1px solid var(--ring);border-radius:12px;
  color:var(--ink);font:inherit;font-size:15px;padding:12px 14px;margin-bottom:16px}
.pk .search::placeholder{color:var(--muted)}
.pk .back{background:none;border:0;color:var(--blue);font:inherit;font-size:13.5px;font-weight:600;
  cursor:pointer;padding:6px 0;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.pk .addrow{display:flex;gap:9px;margin-top:13px}
.pk .addrow input{flex:1;background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;
  color:var(--ink);font:inherit;font-size:14px;padding:10px 12px}
.pk .addrow button{background:var(--blue);border:0;color:#fff;font:inherit;font-size:14px;
  font-weight:700;border-radius:10px;padding:10px 17px;cursor:pointer}
@media (min-width: 760px) {
  .pk h2{font-size:19px}
  .pk .baggrid{grid-template-columns:1fr 1fr;gap:12px}
  .pk .tl{padding-left:30px}
}
@media (min-width: 1080px) {
  .pk .baggrid{grid-template-columns:repeat(3,1fr)}
}

/* ---------- add an item: pick the bag ---------- */
.pk .pickbags{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.pk .pickbag{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--grid);
  border-radius:999px;padding:7px 12px 7px 8px;cursor:pointer}
.pk .pickbag .pbox{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--baseline);
  display:grid;place-items:center}
.pk .pickbag .pbox svg{width:11px;height:11px;fill:none;stroke:#0b0b0b;stroke-width:3.2;
  stroke-linecap:round;stroke-linejoin:round;opacity:0}
.pk .pickbag.on{border-color:var(--bc);color:var(--ink);
  background:color-mix(in srgb,var(--bc) 15%,transparent)}
.pk .pickbag.on .pbox{background:var(--bc);border-color:var(--bc)}
.pk .pickbag.on .pbox svg{opacity:1}
.pk .addgo{width:100%;font:inherit;font-size:14px;font-weight:650;cursor:pointer;
  background:var(--blue);color:#fff;border:0;border-radius:11px;padding:12px 14px}
.pk .addgo.off{background:var(--surface-2);color:var(--baseline);cursor:default}
.pk .subnote{font-size:12px;color:var(--ink-2);line-height:1.5;margin:-4px 0 8px}
.pk .covered{margin-top:11px;font-size:12px;color:#7fe0ad;text-align:center;
  background:rgba(93,214,146,.1);border:1px solid rgba(93,214,146,.26);
  border-radius:10px;padding:8px 10px}

/* ---------- baggage allowance, icons only ---------- */
.pk .allow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px;
  font-variant-numeric:tabular-nums}
/* .bag is display:flex, so in a non-flex parent it would stretch to the full
   width. Pin it to its content and restore the padding the .pk * reset takes. */
.pk .allow .bag{flex:0 0 auto;width:auto;padding:3px 10px 3px 8px}

.pk .counthint{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:10px}
</style>
</head>

<script>const SB_URL = "https://xsgvdwoekpluynhsdlxm.supabase.co",

  store = {
    get(e, t) {

let T = null,

  },
  nDays = (e, t) => Math.round((t - e) / 864e5),
  DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
  MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
  MONL = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December",
  ],
  fmt = (e) => {
    const t = D(e);
    return DOW[t.getDay()] + " " + t.getDate() + " " + MON[t.getMonth()];
  },
  fmtS = (e) => {
    const t = D(e);
    return t.getDate() + " " + MON[t.getMonth()];
  },
  fmtL = (e) => {
    const t = D(e);
    return DOW[t.getDay()] + " " + t.getDate() + " " + MON[t.getMonth()] + " " + t.getFullYear();
  },
  tm = (e) => (e && e.includes("T") ? e.split("T")[1] : e || ""),
  esc = (e) =>
    String(null == e ? "" : e).replace(
      /[&<>"]/g,
      (e) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[e],
    ),
  mine = (e) => "ALL" === WHO || "RP" === e.who || e.who === WHO,
  whoChip = (e) =>
    "ALL" !== WHO
      ? ""
      : `<span class="mchip who-${e}">${"RP" === e ? "Everyone" : "R" === e ? "Robbie" : "Mum &amp; Dad"}</span>`,
  city = (e) => T.cities[e] || { name: e, code: e },
  money = (e, t) =>
    null == e
      ? ""
      : ("GBP" === t
          ? "£"
          : "USD" === t
            ? "$"
            : "THB" === t
              ? "฿"
              : "AUD" === t
                ? "A$"
                : "QAR" === t
                  ? "QAR "
                  : t + " ") +
        e.toLocaleString("en-GB", {
          minimumFractionDigits: e % 1 ? 2 : 0,

  mapURL = (e, t) =>
    e
      ? `https://maps.google.com/?q=${e}(${encodeURIComponent(t)})`

  mapLink = (e, t) =>
    `<a class="maplink" href="${mapURL(e, t)}" target="_blank" rel="noopener">◎ Open in Maps</a>`,
  inAU = (e) => {
    const t = llOf(e);
    return !!t && t[0] < -9 && t[0] > -45 && t[1] > 112 && t[1] < 155;
  },
  wazeURL = (e) => {
    const t = llOf(e);
    return `https://waze.com/ul?ll=${t[0]},${t[1]}&navigate=yes`;
  },
  wazeLink = (e) =>
    inAU(e)
      ? `<a class="maplink waze" href="${wazeURL(e)}" target="_blank" rel="noopener">▲ Open in Waze</a>`
      : "";
function events() {
  const e = [];
  return (
    T.flights
      .filter(mine)
      .forEach((t) =>
        e.push({
          d: t.dep.slice(0, 10),
          t: tm(t.dep),
          who: t.who,

          title: `${t.no} · ${city(t.from).code} → ${city(t.to).code}`,
          sub: t.tbc

          sub: t.tbc ? "Not booked" : t.included ? "Included" : "",
          at: DT(t.date + "T" + (t.time || "12:00")),

      (e.push({

        who: t.who,

        e.push({
          d: t.out.slice(0, 10),
          t: "00:00" === tm(t.out) ? "" : tm(t.out),

          kind: "out",
          title: "Check out · " + t.name,
          sub: city(t.city).name,
          at: DT(t.out),

    }),
    T.activities
      .filter(mine)
      .forEach((t) =>
        e.push({
          d: t.date,
          t: t.start || "",
          who: t.who,
          kind: "act",
          title: t.name,
          sub: [t.type, t.loc].filter(Boolean).join(" · "),
          at: DT(t.date + "T" + (t.start || "09:00")),

const onDay = (e) => events().filter((t) => t.d === e),
  stayOn = (e) =>
    T.stays.filter(mine).find((t) => t.in.slice(0, 10) <= e && e < t.out.slice(0, 10)),
  gapOn = (e) => T.gaps.filter(mine).find((t) => t.from <= e && e < t.to);
function whereOn(e) {
  const t = stayOn(e);
  if (t) return city(t.city);
  const n = gapOn(e);
  if (n) return city(n.city);
  return T.flights.filter(mine).find((t) => t.dep.slice(0, 10) === e)
    ? { name: "In transit", code: "—", tz: null }
    : null;
}
function nextFlight() {
  if (!T || !T.flights) return null;
  const e = Date.now();
  return (
    T.flights
      .filter(mine)
      .filter((t) => t.dep && new Date(t.dep).getTime() > e)
      .slice()
      .sort((e, t) => e.dep.localeCompare(t.dep))[0] || null
  );
}
function flightCD() {
  return '<div class="card cdw">\n    <div class="cd-top"><span class="cd-dot"></span><span class="kicker">Next flight</span></div>\n    <div class="cd-route" id="cdRoute">&mdash;</div>\n    <div class="cdgrid">\n      <div class="cdu"><b id="cd-d">--</b><i>days</i></div>\n      <div class="cdu"><b id="cd-h">--</b><i>hrs</i></div>\n      <div class="cdu"><b id="cd-m">--</b><i>min</i></div>\n      <div class="cdu"><b id="cd-s">--</b><i>sec</i></div>\n    </div>\n    <div class="cd-when" id="cdWhen"></div>\n  </div>';
}
/* The stay you are in today, or the next one to start. No countdown — knowing
   which bed is next is the useful part, not how many seconds away it is. */
function nextStay() {
  if (!T || !T.stays) return null;
  const e = iso(today()),
    t = T.stays
      .filter(mine)
      .slice()
      .sort((e, t) => e.in.localeCompare(t.in));
  return (
    t.find((t) => t.in.slice(0, 10) <= e && e < t.out.slice(0, 10)) ||
    t.find((t) => t.in.slice(0, 10) > e) ||
    null
  );
}
function stayNext() {
  const e = nextStay();
  if (!e) return "";
  const t = e.in.slice(0, 10) <= iso(today()) ? "Where you are" : "Next stay";
  return `<div class="card nxs tapc" onclick="openStay(${e._i})">\n    <div class="nxs-head"><span class="kicker">${t}</span>\n      <span class="nxs-n">${wxChip(e.in.slice(0, 10))}${e.nights} night${1 === e.nights ? "" : "s"}</span></div>\n    ${hero(e, "")}\n    <div class="nxs-body">\n      <h3 class="nxs-name">${esc(e.name)}</h3>\n      <div class="nxs-when">${fmtL(e.in.slice(0, 10))} &rarr; ${fmtL(e.out.slice(0, 10))}</div>\n      <div class="nxs-chips">${whoChip(e.who)}</div>\n    </div>\n    <svg class="nb-arw" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>\n  </div>`;
}
/* Packing ticks are already stored per leg; this just shows the number on the

function packCard() {
  if ("P" === WHO || "object" != typeof PK || !PK.progress) return "";
  const e = PK.progress();
  if (!e || !e.t) return "";

}
const NAVI = {
  flights:
    '<path d="M21 15.5 3 10V6.6l2 .7 1.6 2.3 5.1 1.6L9.2 3h2.6l5.4 7.9 3.4 1c.9.3 1.4.9 1.4 1.8v1.8z"/><path d="M3 19.5h18"/>',
  stays: '<path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/>',
  plans:
    '<path d="M8 3v4M16 3v4"/><rect x="3" y="6" width="18" height="15" rx="2"/><path d="M3 11h18"/><path d="M8.5 15.5 11 18l4.5-4.5"/>',
  ideas:
    '<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.3 1.1 2.2h5c.1-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/>',
  map: '<path d="m9 4-6 2.5v13L9 17l6 3 6-2.5v-13L15 7z"/><path d="M9 4v13"/><path d="M15 7v13"/>',

<script>const PACKDATA={"items":[{"id":"passport","name":"Passport","cat":"docs","bag":"SL","qty":1,"g":60,"fate":"always","note":"","crit":true},{"id":"eta-aus","name":"Australian ETA","cat":"docs","bag":"SL","qty":1,"g":0,"fate":"always","note":"Approved before you fly \u2014 the airline checks it at Gatwick.","crit":true},{"id":"licence","name":"Driving licence","cat":"docs","bag":"SL","qty":1,"g":10,"fate":"store","note":"","crit":true},{"id":"cards","name":"Bank cards \u2014 two providers","cat":"docs","bag":"SL","qty":2,"g":20,"fate":"always","note":"Tracker card in the wallet. Split across two bags so one loss isn't total.","crit":true},{"id":"cash-thb","name":"Cash \u2014 25,000 THB","cat":"docs","bag":"SL","qty":1,"g":60,"fate":"always","note":"Ordered and paid, ref STM30429677 \u2014 GBP 598.23 at 41.7898. Half the original plan and still comfortable, because most of Thailand is already covered: Khao Sok is fully prepaid apart from the THB 340 park and pier fee, and in Bangkok and Samui the rooms are paid and your parents are picking up most of the rest. So this is really Phuket and Ao Nang money \u2014 food, longtails, taxis, beach days. Top up from an ATM in Bangkok if it runs low. Well under Thailand's declaration threshold (USD 20,000 equivalent), so nothing to declare. Split it \u2014 some in the sling, some in a case, some in the hotel safe. Do not carry the lot in one place for 67 days.","crit":true},{"id":"cash-aud","name":"Cash \u2014 200 AUD","cat":"docs","bag":"SL","qty":1,"g":15,"fate":"always","note":"Ordered and paid, ref STM30429677 \u2014 GBP 109.07 at 1.8337. You said Australia is effectively cashless and you'd made that mistake before, so treat this as an emergency float, not spending money: a cab that won't take cards, a tip, Rottnest, a market stall at Fremantle. Keep a twenty on you and the rest in the case. It is dead weight after 7 Jan \u2014 spend it or give it away before you fly to Phuket.","crit":false},{"id":"phone","name":"Phone","cat":"tech","bag":"SL","qty":1,"g":220,"fate":"always","note":"","crit":true},{"id":"watch","name":"Apple Watch","cat":"tech","bag":"WORN","qty":1,"g":50,"fate":"always","note":"","crit":false},{"id":"airpods","name":"AirPods Pro","cat":"tech","bag":"SL","qty":1,"g":60,"fate":"always","note":"Your everyday set once the over-ears are parked.","crit":false},{"id":"sony","name":"Sony over-ear headphones","cat":"tech","bag":"SL","qty":1,"g":250,"fate":"store","note":"Earn their place over the 26 hours out. Into the stored case in Phuket, collected on the 23rd for the flight home.","crit":false},{"id":"ipad-air","name":"iPad Air","cat":"tech","bag":"CB","qty":1,"g":460,"fate":"always","note":"Reading and films. Comes everywhere.","crit":false},{"id":"mba","name":"MacBook Air","cat":"tech","bag":"L2","qty":1,"g":1240,"fate":"store","note":"You work from Perth and stop in Thailand. Into the stored case in Phuket \u2014 it does not need to see Samui or the lake.","crit":true},{"id":"dongle","name":"USB-C dongle","cat":"tech","bag":"L2","qty":1,"g":40,"fate":"store","note":"Stores with the Air.","crit":false},{"id":"mouse","name":"Mouse","cat":"tech","bag":"CB","qty":1,"g":80,"fate":"always","note":"Stays with you. With the iPad and the fold-up keyboard it is a working setup without the laptop.","crit":false},{"id":"keyboard","name":"Travel keyboard \u2014 ProtoArc XK01","cat":"tech","bag":"L1","qty":1,"g":298,"fate":"always","note":"Tri-fold, full size with a number pad, UK QWERTY. 298 g, which is not nothing \u2014 it rides in a suitcase until Bangkok and only moves to the backpack once the cases go into storage.","crit":false},{"id":"hdmi","name":"HDMI cable","cat":"tech","bag":"L2","qty":1,"g":90,"fate":"store","note":"General purpose \u2014 hotel TVs, the MacBook. Stores at Phuket.","crit":false},{"id":"hdmi-switch","name":"Nintendo Switch HDMI cable","cat":"tech","bag":"L1","qty":1,"g":80,"fate":"store","note":"Travels with the Switch.","crit":false},{"id":"ps5-pad","name":"PS5 controller","cat":"tech","bag":"L1","qty":1,"g":280,"fate":"store","note":"For Remote Play. Qatar's Starlink should genuinely carry it \u2014 the bandwidth is there and satellite latency is usually workable. Worth testing on the Gatwick to Doha leg before you count on it for the 14 hours to Perth. Pairs natively with the iPad Air as the fallback.","crit":false},{"id":"switch","name":"Nintendo Switch","cat":"tech","bag":"L1","qty":1,"g":400,"fate":"store","note":"Stays in the stored cases 10\u201323 Jan, then into the cabin bag at Bangkok for the flight home.","crit":false},{"id":"plug-uk","name":"60W USB-C mains supply","cat":"tech","bag":"CB","qty":1,"g":90,"fate":"always","note":"Out of the backpack and into the hold \u2014 but the cabin bag, not a suitcase. The suitcases sit in Bangkok 10\u201323 Jan and this is the only charger that will do the iPad.","crit":true},{"id":"adapter-universal","name":"Travel adapter with USB-C","cat":"tech","bag":"CB","qty":1,"g":180,"fate":"always","note":"UK Type G, Australia Type I, Thailand A/C. Check it is rated for the laptop charger, not just phones.","crit":true},{"id":"charger-3in1","name":"Fold-up 3-in-1 charger","cat":"tech","bag":"CB","qty":1,"g":180,"fate":"always","note":"Watch, phone and AirPods from one plug. In the cabin bag rather than a suitcase for the same reason as the 60W \u2014 you need it in Thailand, and the cases are in storage.","crit":false},{"id":"cable-ext","name":"Extendable USB-C cable","cat":"tech","bag":"BP","qty":1,"g":70,"fate":"always","note":"","crit":false},{"id":"cable-shaver","name":"Shaver cable","cat":"tech","bag":"L2","qty":1,"g":40,"fate":"always","note":"Not USB-C at both ends, so nothing else in the bag will charge it. The one cable with no substitute \u2014 pack it with the shaver, not loose.","crit":true,"inbag":"washbag-lg"},{"id":"brick-sm","name":"Power bank \u2014 small","cat":"tech","bag":"SL","qty":1,"g":200,"fate":"always","note":"The only one you are taking \u2014 the large one is out. Cabin baggage only, never checked.","crit":true},{"id":"mouthtape","name":"Mouth tape","cat":"flight","bag":"BP","qty":1,"g":20,"fate":"always","note":"","crit":false},{"id":"eyemask","name":"Eye mask","cat":"flight","bag":"BP","qty":1,"g":30,"fate":"always","note":"QR835 is an overnight and QR107 lands at 06:35.","crit":false},{"id":"earplugs","name":"Earplugs","cat":"flight","bag":"BP","qty":1,"g":10,"fate":"always","note":"","crit":false},{"id":"snacks","name":"Snacks for travel days","cat":"flight","bag":"SL","qty":1,"g":150,"fate":"always","note":"","crit":false},{"id":"washbag-lg","name":"Fold-out washbag \u2014 large","cat":"toiletries","bag":"L2","qty":1,"g":260,"fate":"store","note":"Lives in the suitcase. Into storage from Phuket onwards.","crit":false},{"id":"washbag-mini","name":"Mini washbags","cat":"toiletries","bag":"CB","qty":2,"g":80,"fate":"always","note":"The hand-luggage pair. These are what you actually use on travel days and at the lake.","crit":true},{"id":"liquids-bag","name":"Clear 1L liquids bag","cat":"toiletries","bag":"CB","qty":1,"g":20,"fate":"always","note":"Re-cleared at Perth, Phuket, Bangkok and Krabi. Keep it reachable.","crit":true},{"id":"decant","name":"Decant bottles, 100 ml","cat":"toiletries","bag":"L2","qty":5,"g":150,"fate":"always","note":"Fill these in Phuket, before the full-size goes into storage. For the lake you really only need suncream and the basics \u2014 Hansar, Krabi La Playa and Theatre Residence all provide the rest.","crit":true,"inbag":"washbag-lg"},{"id":"suncream","name":"Suncream \u2014 full size","cat":"toiletries","bag":"L2","qty":1,"g":200,"fate":"always","note":"Australian suncream is the best there is and cheap. Decant 100 ml for the onward leg.","crit":true,"inbag":"washbag-lg"},{"id":"suncream-tr","name":"Travel suncream","cat":"toiletries","bag":"L2","qty":1,"g":80,"fate":"always","note":"For the plane and the first day before you buy properly.","crit":false,"inbag":"washbag-lg"},{"id":"suncream-face","name":"Face suncream","cat":"toiletries","bag":"CB","qty":1,"g":50,"fate":"always","note":"In the case out to Australia, then into the cabin bag at the Bangkok changeover.","crit":false},{"id":"showergel","name":"Mini shower gel","cat":"toiletries","bag":"CB","qty":1,"g":60,"fate":"always","note":"Day one in Perth and the Rottnest day, then into the cabin bag at Bangkok for whatever Thailand throws up.","crit":false},{"id":"facewash","name":"Travel facewash","cat":"toiletries","bag":"CB","qty":1,"g":90,"fate":"always","note":"","crit":false,"inbag":"washbag-mini"},{"id":"moisturiser","name":"Moisturiser","cat":"toiletries","bag":"CB","qty":1,"g":100,"fate":"always","note":"Cabin bag on both long-hauls. Three sectors of dry cabin air each way.","crit":true,"inbag":"washbag-mini"},{"id":"eyecream","name":"Eye cream","cat":"toiletries","bag":"L2","qty":1,"g":40,"fate":"always","note":"","crit":false,"inbag":"washbag-lg"},{"id":"sanitiser","name":"Hand sanitiser","cat":"toiletries","bag":"CB","qty":1,"g":60,"fate":"always","note":"","crit":false,"inbag":"liquids-bag"},{"id":"mozzie","name":"Mosquito spray","cat":"toiletries","bag":"L2","qty":1,"g":120,"fate":"always","note":"Khao Sok is jungle on water and the lake is worst at dusk. Top up with stronger DEET in Thailand if yours is mild.","crit":true,"inbag":"washbag-lg"},{"id":"shaver","name":"Electric shaver","cat":"toiletries","bag":"CB","qty":1,"g":220,"fate":"always","note":"Cabin bag on both long-hauls \u2014 you want a shave before landing in Perth and again before Heathrow. Lithium batteries belong in the cabin anyway, not the hold.","crit":true,"inbag":"washbag-mini"},{"id":"shave-foam","name":"Mini shaving foam","cat":"toiletries","bag":"CB","qty":1,"g":100,"fate":"always","note":"Under 100 ml, so it lives in the clear liquids bag. Cabin bag on both long-hauls.","crit":true,"inbag":"liquids-bag"},{"id":"toothpaste-mini","name":"Mini toothpaste","cat":"toiletries","bag":"CB","qty":1,"g":40,"fate":"always","note":"For the Gatwick night and the flight. Full size bought in Perth.","crit":true,"inbag":"liquids-bag"},{"id":"toothpaste","name":"Toothpaste \u2014 full size","cat":"toiletries","bag":"L2","qty":1,"g":120,"fate":"always","note":"In the case out to Australia and back. It comes into the cabin bag at Bangkok for the thirteen days the cases are in storage, then goes back in the case on the 23rd.","crit":false,"inbag":"washbag-lg"},{"id":"etoothbrush","name":"Electric toothbrush","cat":"toiletries","bag":"CB","qty":1,"g":180,"fate":"always","note":"Toothpaste bought on arrival; Qatar give you a travel one for the flight. Check the charger \u2014 most are an inductive base with a fixed plug, which needs the travel adapter.","crit":true,"inbag":"washbag-mini"},{"id":"deodorant","name":"Roll-on deodorant","cat":"toiletries","bag":"CB","qty":1,"g":100,"fate":"always","note":"The one you are using. Roll-on is not a liquid for cabin purposes and does not leak at altitude.","crit":true,"inbag":"liquids-bag"},{"id":"deodorant-spare","name":"Roll-on deodorant \u2014 2 spare","cat":"toiletries","bag":"L2","qty":2,"g":200,"fate":"always","note":"In the large washbag. 67 days is more than one stick.","crit":false,"inbag":"washbag-lg"},{"id":"aftershave","name":"Aftershave atomiser","cat":"toiletries","bag":"CB","qty":1,"g":60,"fate":"always","note":"One small atomiser covers all 67 days and clears cabin liquids without a thought.","crit":false,"inbag":"liquids-bag"},{"id":"lipbalm","name":"Lip balm with SPF","cat":"toiletries","bag":"CB","qty":1,"g":15,"fate":"always","note":"Six hours cycling at Rottnest, a lot of beach, and three long-haul sectors of dry cabin air.","crit":false,"inbag":"liquids-bag"},{"id":"nail","name":"Nail clippers","cat":"toiletries","bag":"L2","qty":1,"g":40,"fate":"always","note":"Fine in checked. Cabin rules on clippers vary by airport.","crit":false,"inbag":"washbag-lg"},{"id":"medkit","name":"Small medical pouch","cat":"health","bag":"L2","qty":1,"g":60,"fate":"always","note":"","crit":false,"inbag":"washbag-lg"},{"id":"imodium","name":"Imodium","cat":"health","bag":"CB","qty":1,"g":20,"fate":"always","note":"The 07:00 ferry on the 17th, then 2h15 by road to the lake. You cannot buy this at 6am on a pier.","crit":true,"inbag":"washbag-mini"},{"id":"paracetamol","name":"Paracetamol","cat":"health","bag":"CB","qty":1,"g":40,"fate":"always","note":"","crit":false,"inbag":"washbag-mini"},{"id":"ibuprofen","name":"Ibuprofen","cat":"health","bag":"CB","qty":1,"g":40,"fate":"always","note":"","crit":false,"inbag":"washbag-mini"},{"id":"antihistamine","name":"Antihistamine","cat":"health","bag":"L2","qty":1,"g":20,"fate":"always","note":"Bites, heat rash, unfamiliar food.","crit":false,"inbag":"washbag-lg"},{"id":"antiseptic","name":"Antiseptic cream","cat":"health","bag":"L2","qty":1,"g":40,"fate":"always","note":"Coral and scooter scrapes infect fast in the tropics.","crit":true,"inbag":"washbag-lg"},{"id":"plasters","name":"Plasters + blister plasters","cat":"health","bag":"L2","qty":1,"g":50,"fate":"always","note":"Blister plasters specifically \u2014 new sandals and a lot of walking.","crit":true,"inbag":"washbag-lg"},{"id":"rehydration","name":"Rehydration sachets","cat":"health","bag":"L2","qty":6,"g":60,"fate":"always","note":"Heat, beer and stomach trouble. Tiny and cheap.","crit":false,"inbag":"washbag-lg"},{"id":"athletes","name":"Athlete's foot cream","cat":"health","bag":"L2","qty":1,"g":50,"fate":"always","note":"Humidity, flip-flops, wet bathrooms.","crit":false,"inbag":"washbag-lg"},{"id":"prescriptions","name":"Prescription medication","cat":"health","bag":"CB","qty":1,"g":100,"fate":"always","note":"Enough for 67 days plus buffer, in original packaging, in hand luggage.","crit":true},{"id":"mbp","name":"MacBook Pro \u2014 for handover","cat":"tech","bag":"L2","qty":1,"g":1600,"fate":"handover","note":"Given away in Phuket, 7\u201310 Jan. Sign out of your Apple ID and erase it BEFORE you fly \u2014 doing that over hotel wifi with a deadline is miserable. Remove it from Find My or it stays activation-locked and useless to them.","crit":true},{"id":"ipad-mini","name":"iPad mini \u2014 for handover","cat":"tech","bag":"L2","qty":1,"g":300,"fate":"handover","note":"Same: signed out, erased and removed from Find My before you fly.","crit":true},{"id":"larq","name":"Larq bottle, 1L","cat":"kit","bag":"BP","qty":1,"g":500,"fate":"always","note":"Self-cleaning, so it earns itself in Thailand. Empty through security, fill after.","crit":true},{"id":"towel-lg","name":"Microfibre towels \u2014 large","cat":"kit","bag":"L1","qty":2,"g":680,"fate":"store","note":"Both stay in the stored case through Thailand \u2014 every hotel from Phuket onwards provides towels.","crit":false},{"id":"towel-sm","name":"Microfibre towel \u2014 mini","cat":"kit","bag":"CB","qty":1,"g":120,"fate":"always","note":"The one that matters onward \u2014 ferries, the lake, Krabi longtails.","crit":true},{"id":"drybag","name":"Dry bag, small \u2014 TO BUY","cat":"kit","bag":"BP","qty":1,"g":120,"fate":"buy","note":"Not owned yet. Khao Sok arrives by boat, the ferry deck is wet and Krabi longtails soak everything. Phone, wallet and the Switch while you're on the water.","crit":true},{"id":"cubes","name":"Packing cubes","cat":"kit","bag":"CB","qty":4,"g":0,"fate":"always","note":"Weigh nothing worth counting. They are what makes the Phuket changeover quick rather than an afternoon.","crit":true},{"id":"sunglasses","name":"Sunglasses \u2014 4 pairs in a travel case","cat":"kit","bag":"L1","qty":4,"g":400,"fate":"store","note":"The travel case lives in the suitcase. Include the cheap pairs here \u2014 these are the ones for the water and the longtails.","crit":true},{"id":"sunglasses-daily","name":"Sunglasses","cat":"kit","bag":"SL","qty":1,"g":120,"fate":"always","note":"","crit":false},{"id":"scales","name":"Luggage scales","cat":"kit","bag":"CB","qty":1,"g":100,"fate":"always","note":"You have a live 7 kg problem on TG206. Pays for itself once.","crit":true},{"id":"laundry-bag","name":"Dirty laundry bags","cat":"kit","bag":"CB","qty":2,"g":110,"fate":"always","note":"Two, so dirty and damp stay apart from clean. Thai laundry charges by the kilo and bagged is faster to drop off.","crit":false},{"id":"binbags","name":"Bin bags","cat":"kit","bag":"CB","qty":5,"g":60,"fate":"always","note":"Wet swimwear, sandy shoes, the shirt you sweated through on the ferry. Weigh nothing and solve a problem every few days.","crit":false},{"id":"goggles","name":"Swimming goggles","cat":"kit","bag":"CB","qty":1,"g":80,"fate":"buy","note":"Worth having \u2014 the Sebel and the office both have gyms, and there is a lot of sea between Scarborough, Samui and Krabi.","crit":false},{"id":"notepad","name":"Thai notepad","cat":"kit","bag":"L2","qty":1,"g":90,"fate":"always","note":"","crit":false},{"id":"book","name":"Book","cat":"kit","bag":"BP","qty":1,"g":250,"fate":"always","note":"In the backpack on every flight. The one thing that works with the seatbelt sign on and the tray table up.","crit":false},{"id":"daypack","name":"Lockable daypack","cat":"kit","bag":"CB","qty":1,"g":320,"fate":"always","note":"Rottnest, the ferries and Bangkok. Lockable zips and a slash-resistant strap.","crit":true},{"id":"trainers-nice","name":"Nice trainers","cat":"footwear","bag":"CB","qty":1,"g":780,"fate":"always","note":"Your smart-casual pair. Fine at Vertigo and Blue Elephant \u2014 long trousers are the part they actually care about.","crit":false},{"id":"trainers-old","name":"Old trainers","cat":"footwear","bag":"L1","qty":1,"g":750,"fate":"store","note":"The pair you don't mind ruining. Perth beaches and anything messy.","crit":false},{"id":"running","name":"Running shoes","cat":"footwear","bag":"CB","qty":1,"g":720,"fate":"always","note":"Gym the whole trip, so these travel onward.","crit":false},{"id":"sandals","name":"Sandals","cat":"footwear","bag":"CB","qty":1,"g":400,"fate":"always","note":"The ones you can walk miles in and get wet \u2014 Khao Sok, the piers, Krabi.","crit":true},{"id":"sliders","name":"Sliders","cat":"footwear","bag":"CB","qty":1,"g":280,"fate":"always","note":"Beach, pool, hotel bathrooms.","crit":false},{"id":"shirts-nice","name":"Nice shirts","cat":"clothing","bag":"CB","qty":8,"g":1600,"fate":"always","note":"Dinners, Christmas, Bangkok, and sun cover that still reads as clothing.","crit":false},{"id":"tees","name":"T-shirts","cat":"clothing","bag":"CB","qty":12,"g":1800,"fate":"always","note":"6 come to Thailand, 6 wait in Bangkok. Every hotel from Phuket onwards has washing facilities, so the Thailand count is deliberately lean.","crit":false},{"id":"shorts","name":"Shorts","cat":"clothing","bag":"CB","qty":6,"g":1200,"fate":"always","note":"","crit":false},{"id":"trousers","name":"Trousers","cat":"clothing","bag":"CB","qty":1,"g":450,"fate":"always","note":"For the two or three nights out \u2014 Vertigo, Blue Elephant, Christmas dinner. Elephant pants bought in Thailand cover the temples; shorts cover everything else.","crit":true},{"id":"swim","name":"Swim shorts","cat":"clothing","bag":"CB","qty":2,"g":200,"fate":"always","note":"Two, so one is always dry.","crit":true},{"id":"boxers","name":"Boxers","cat":"clothing","bag":"CB","qty":8,"g":270,"fate":"always","note":"","crit":false},{"id":"socks-white","name":"White socks","cat":"clothing","bag":"CB","qty":8,"g":320,"fate":"always","note":"","crit":false},{"id":"socks-gym","name":"Gym socks","cat":"clothing","bag":"CB","qty":3,"g":120,"fate":"always","note":"","crit":false},{"id":"compression","name":"Compression socks","cat":"clothing","bag":"BP","qty":1,"g":90,"fate":"always","note":"For the long-haul. Worth it on a 26-hour door-to-door and again on the way back.","crit":true},{"id":"gym-tops","name":"Gym tops","cat":"clothing","bag":"CB","qty":3,"g":300,"fate":"always","note":"","crit":false},{"id":"gym-shorts","name":"Gym shorts","cat":"clothin . Nintendo Switch out of the backpack, into Suitcase 2","note":"The only thing going the other way. Do it now or you will be carrying it round Thailand for thirteen days."},{"n":"5. Zip and lock both cases"},{"n":"6. Hand over, photograph the receipt","note":"Ref 14XIWBX4, paid, 10\u201323 Jan. Check the collection time on the receipt matches your 23rd."},{"n":"7. Check the cabin bag closes","note":"It has gone from about 6 kg to about 15.6 kg. Use the expander zip if it needs it \u2014 better now than on a hotel bed at 22:00."}],"bags":[{"bag":"CB","mode":"with","items":[{"n":"GAINS \u2014 the three cubes","note":"About 9.9 kg of clothes, footwear and kit, straight out of Suitcase 1.","inside":[{"n":"Cube 1 \u2014 clothing"},{"n":"Cube 2 \u2014 gym and footwear"},{"n":"Cube 3 \u2014 kit"}]},{"n":"ALREADY IN IT","note":"Washbag, health kit, decants, suncream, mosquito spray, chargers, mouse, adapter, towel, daypack, scales, one change of clothes."},{"n":"RESULT: about 15.6 kg","note":"No weight limit applies to it again until the 23rd. This is your luggage now."}],"note":"","ids":["washbag-mini","facewash","shaver","etoothbrush","moisturiser","medkit","paracetamol","ibuprofen","imodium","antihistamine","antiseptic","plasters","rehydration","athletes","decant","suncream-tr","suncream-face","showergel","toothpaste","mozzie","plug-uk","charger-3in1","mouse","adapter-universal","towel-sm","daypack","compression","scales","cubes",["boxers",5],["socks-white",5],["tees",6],["shirts-nice",2],["shorts",2],"trousers","swim","belt","pyjamas",["gym-tops",2],"gym-shorts",["socks-gym",2],"running","sandals","sliders",["hats",1],"hat-gym","drybag","goggles","laundry-bag","binbags"]},{"bag":"BP","mode":"with","items":[{"n":"LOSES \u2014 the Nintendo Switch","note":"Into Suitcase 2."},{"n":"GAINS \u2014 the travel keyboard","note":"Out of Cube 3. With the iPad and the mouse that is a working setup for the rest of the trip."},{"n":"KEEPS","note":"Book, iPad, cable, prescriptions, liq

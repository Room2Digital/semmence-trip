<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Australia &amp; Thailand</title>
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trip">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" href="icon-512.png?v=3">
<style>{{BASE_CSS}}</style>
<style id="appcss">{{APP_CSS}}</style>
<style>{{PACK_CSS}}</style>
</head>
<body>
<header><div class="wrap">
  <div class="hbanner" aria-label="Australia and Thailand">
    <svg viewBox="0 0 720 120" preserveAspectRatio="xMidYMax slice" role="img" aria-hidden="true">
      <defs>
        <linearGradient id="bsky" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#17334f"/>
          <stop offset=".28" stop-color="#3b4470"/>
          <stop offset=".5" stop-color="#95505a"/>
          <stop offset=".72" stop-color="#dd6c3c"/>
          <stop offset="1" stop-color="#eab14a"/>
        </linearGradient>
        <linearGradient id="bsea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1b4260"/>
          <stop offset="1" stop-color="#0a1620"/>
        </linearGradient>
        <linearGradient id="bfade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0d0d0d" stop-opacity=".5"/>
          <stop offset=".4" stop-color="#0d0d0d" stop-opacity="0"/>
          <stop offset="1" stop-color="#0d0d0d" stop-opacity=".78"/>
        </linearGradient>
      </defs>
      <rect width="720" height="120" fill="url(#bsky)"/>
      <circle cx="396" cy="78" r="26" fill="#ffd89b" opacity=".9"/>
      <g fill="#070c12" opacity=".95">
        <path d="M18 70h20v24H18zM42 54h16v40H42zM62 64h13v30H62z"/>
        <path d="M79 40h23v54H79zM90.5 26l11.5 14H79z"/>
        <path d="M107 60h15v34h-15zM127 48h19v46h-19zM150 66h17v28h-17z"/>
        <path d="M172 34h19v60h-19zM180.5 20h2v14h-2z"/>
        <path d="M196 56h25v38h-25zM225 68h17v26h-17zM246 60h13v34h-13z"/>
        <path d="M264 50h6v44h-6zM266.2 32h1.6v18h-1.6z"/>
        <path d="M276 72h14v22h-14z"/>
      </g>
      <g fill="#070c12" opacity=".95">
        <path d="M486 86h48v8h-48z"/>
        <path d="M464 88l46-28 46 28z"/>
        <path d="M464 88c-7-3-11-8-12-15 5 5 9 10 12 15zm92 0c7-3 11-8 12-15-5 5-9 10-12 15z"/>
        <path d="M476 70l34-22 34 22z"/>
        <path d="M476 70c-6-3-9-7-10-13 4 4 7 8 10 13zm68 0c6-3 9-7 10-13-4 4-7 8-10 13z"/>
        <path d="M490 54l20-15 20 15z"/>
        <path d="M509 39h2v-9h-2z"/>
        <path d="M510 26l2.6 4.4-2.6 1.6-2.6-1.6z"/>
        <path d="M600 94l5-12h30l5 12z"/>
        <path d="M608 82c0-16 24-16 24 0z"/>
        <path d="M606 78h28v3h-28z"/>
        <path d="M616 66h8v-4h-8zM617.5 62h5v-6h-5z"/>
        <path d="M619 56h2V30h-2z"/>
        <path d="M620 22l1.6 8h-3.2z"/>
      </g>
      <g fill="#070c12" opacity=".95">
        <path d="M676 94c-2-12-2-20-1-28h4c-1 8-1 16 1 28z"/>
        <path d="M677 66c-8-10-19-14-30-12 10 1 19 5 28 10zm0 0c8-10 19-14 30-12-10 1-19 5-28 10zm0-1c-4-12 0-22 9-28-5 9-7 18-8 27zm0 0c4-12 0-22-9-28 5 9 7 18 8 27z"/>
        <path d="M433 94c-2-10-2-16-1-23h4c-1 7-1 13 1 23z"/>
        <path d="M434 71c-7-8-16-11-25-10 8 1 16 4 24 8zm0 0c7-8 16-11 25-10-8 1-16 4-24 8zm0-1c-3-10 0-18 8-23-5 8-6 15-7 22z"/>
      </g>
      <rect y="94" width="720" height="26" fill="url(#bsea)"/>
      <g fill="#070c12" opacity=".92">
        <path d="M296 103c26-4 74-4 104 1l-5 8h-92z"/>
        <path d="M348 86h2.4v17H348z"/>
        <path d="M350 88l15 9h-15z"/>
        <path d="M398 105l22 11-3 3-21-10z"/>
      </g>
      <g stroke="#a9cde6" stroke-opacity=".22" stroke-width="2" stroke-linecap="round">
        <path d="M60 110h54M180 116h70M480 116h62M596 108h40"/>
      </g>
      <rect width="720" height="120" fill="url(#bfade)"/>
    </svg>
    <span class="kicker" id="kicker">Itinerary</span>
  </div>
  <div class="hrow">
    <div class="toggle" id="trav">
      <button data-w="R" onclick="setWho('R')"><span class="tdot" style="background:var(--blue)"></span>Robbie</button>
      <button data-w="P" onclick="setWho('P')"><span class="tdot" style="background:var(--magenta)"></span>Mum &amp; Dad</button>
      <button data-w="ALL" onclick="setWho('ALL')">Everyone</button>
    </div>
    <div class="hbtns">
      <button class="fxbtn" onclick="setTab('info')" aria-label="Trip info">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      </button>
      <button class="fxbtn bellbtn" onclick="openNF()" aria-label="Notifications">
        <svg viewBox="0 0 24 24"><path d="M18 16V11a6 6 0 1 0-12 0v5l-1.6 2.2h15.2z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg>
        <span class="nfdotn" id="nfCount">0</span>
      </button>
      <button class="fxbtn" onclick="openFX()" aria-label="Currency converter">
        <svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3"/><path d="M20 16H7l3 3"/></svg>
        <span>£</span>
      </button>
    </div>
  </div>
</div></header>

<main class="wrap" id="view"><div class="center">Loading…</div></main>
<div id="fxhost"></div>
<div id="nfhost"></div>
<div id="sehost"></div>

<nav class="tabs" id="tabs">
  <button data-t="home" onclick="setTab('home')"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span id="hometab">Today</span></button>
  <button data-t="cal" onclick="setTab('cal')"><svg viewBox="0 0 24 24"><path d="M8 3v4M16 3v4"/><rect x="3" y="6" width="18" height="15" rx="2"/><path d="M3 11h18"/></svg><span>Plans</span></button>
  <button data-t="money" onclick="setTab('money')"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></svg><span>Money</span></button>
  <button data-t="pack" onclick="setTab('pack')"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Packing</span></button>
</nav>

<script>{{APP_JS}}</script>
<script>const PACKDATA={{PACK_DATA}};</script>
<script>{{PACK_JS}}</script>
<script>
/* Started here rather than at the end of app.js so the packing module is
   defined before the first render reaches for it. */
((document.getElementById("fxhost").innerHTML = fxBox()),
  (document.getElementById("nfhost").innerHTML = notifBox()),
  fxPaint(),
  boot(),
  "serviceWorker" in navigator && navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Australia &amp; Thailand</title>
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trip">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" href="icon-512.png?v=3">
<style>{{BASE_CSS}}</style>
<style id="appcss">{{APP_CSS}}</style>
</head>
<body>
<header><div class="wrap">
  <div class="hrow">
    <div class="htxt">
      <div class="kicker" id="kicker">Itinerary</div>
      <h1 class="title"><span class="au">Australia</span> <span class="amp">&amp;</span> <span class="th">Thailand</span></h1>
    </div>
    <button class="fxbtn" onclick="openFX()" aria-label="Currency converter">
      <svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3"/><path d="M20 16H7l3 3"/></svg>
      <span>£</span>
    </button>
  </div>
  <div class="toggle" id="trav">
    <button data-w="R" onclick="setWho('R')"><span class="tdot" style="background:var(--blue)"></span>Robbie</button>
    <button data-w="P" onclick="setWho('P')"><span class="tdot" style="background:var(--magenta)"></span>Mum &amp; Dad</button>
    <button data-w="ALL" onclick="setWho('ALL')">Everyone</button>
  </div>
</div></header>

<main class="wrap" id="view"><div class="center">Loading…</div></main>
<div id="fxhost"></div>
<div id="sehost"></div>

<nav class="tabs" id="tabs">
  <button data-t="home" onclick="setTab('home')"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span id="hometab">Today</span></button>
  <button data-t="cal" onclick="setTab('cal')"><svg viewBox="0 0 24 24"><path d="M8 3v4M16 3v4"/><rect x="3" y="6" width="18" height="15" rx="2"/><path d="M3 11h18"/></svg><span>Plans</span></button>
</nav>

<script>{{APP_JS}}</script>
</body>
</html>
